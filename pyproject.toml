[tool.poetry]
name = "munin"
version = "0.1.0"
description = "Agente ReAct de offensive-security con memoria persistente, soul editable, forjado dinámico de tools y grafos, y MCP OFFX integrado."
license = "Proprietary"
readme = "README.md"
packages = [{ include = "munin" }]

[tool.poetry.dependencies]
python = "^3.11"
# Munin imports the stable v1 FastMCP surface.  The v2 SDK moved that module,
# so an unbounded constraint makes fresh CI environments install an
# incompatible release and prevents the MCP server from starting.
mcp = ">=1.0.0,<2"
requests = ">=2.31.0"
ldap3 = ">=2.9.1"
openai = ">=1.40.0"
# --- Agent runtime (issue #9) ---------------------------------------------
# Pinned compatible set, verified against PyPI on 2026-07-30:
#   deepagents 0.7.1  -> langchain >=1.3.14,<2 ; langchain-core >=1.5.0
#   langgraph 1.2.10  -> langchain-core >=1.4.7 ; langgraph-checkpoint >=4.1
#                        langgraph-prebuilt >=1.1 ; langgraph-sdk >=0.4.2,<0.5
#   langgraph-swarm 0.1.0 -> langchain >=1,<2 ; langgraph >=1,<2
# Do NOT reintroduce langgraph-codeact: 0.1.3 pins langgraph <0.4 which is
# unresolvable against this set (pip resolution-too-deep in CI).
langchain = ">=1.3.14,<2"
langchain-core = ">=1.5.0,<2"
langchain-openai = ">=1.4.1,<2"
langgraph = ">=1.2.10,<2"
langgraph-swarm = ">=0.1.0,<0.2"
langgraph-sdk = ">=0.4.2,<0.5"
# ``AsyncSqliteSaver`` is used by the ASGI lifespan and must support the
# LangGraph 1.x checkpoint protocol selected above.
langgraph-checkpoint-sqlite = ">=3.1.1,<4"
deepagents = ">=0.7.1,<0.8"
pydantic = ">=2.0"
click = ">=8.1"
python-dotenv = ">=1.0"
libsql = ">=0.1.11"
"discord.py" = ">=2.4"
cryptography = ">=42.0"
argon2-cffi = ">=25.1.0"
starlette = ">=0.37.2"
uvicorn = { extras = ["standard"], version = ">=0.29.0" }
fastapi = ">=0.110.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = "*"
pytest-cov = "*"
respx = "*"
ruff = ">=0.5"

[tool.poetry.scripts]
munin = "munin.cli:cli"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
