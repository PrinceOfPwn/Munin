version: "3.9"

# OpenLDAP + phpLDAPAdmin — target environment for AKATSUKI Offensive Security.
# The munin service is optional: useful when running everything inside Docker.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: munin-openldap
    environment:
      LDAP_ORGANISATION: "AKATSUKI"
      LDAP_DOMAIN: "akatsuki.com"
      LDAP_BASE_DN: "dc=akatsuki,dc=com"
      LDAP_ADMIN_PASSWORD: "itachi"
      LDAP_CONFIG_PASSWORD: "itachi"
      LDAP_TLS: "false"
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./scripts/ldap_seed:/container/service/slapd/assets/config/bootstrap/ldif/custom
    networks:
      - munin

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: munin-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on: [openldap]
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - munin

  apache-lab:
    build:
      context: ./labs/apache-vulnerable
    container_name: munin-apache-lab
    labels:
      munin.lab: "true"
      munin.training_only: "true"
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - munin

  munin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munin-runtime
    profiles: ["runtime"]
    restart: unless-stopped
    env_file: .env
    environment:
      LDAP_URI: ldap://openldap:389
      LDAP_BASE_DN: dc=akatsuki,dc=com
      MUNIN_MCP_HOST: 0.0.0.0
      MUNIN_MCP_PORT: 8890
      MUNIN_DATA_PATH: /app/data
      MUNIN_SOUL_PATH: /app/soul
    depends_on:
      openldap:
        condition: service_started
    ports:
      - "127.0.0.1:8890:8890"
    volumes:
      - ./data:/app/data
      - ./soul:/app/soul
      - ./munin/generated:/app/munin/generated
      - ./munin/extensions:/app/munin/extensions
      - ./runs:/app/runs
      - ./reports:/app/reports
      - ./evidence:/app/evidence
    networks:
      - munin

  munin-production-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: munin-production-api
    profiles: ["runtime"]
    restart: unless-stopped
    env_file: .env
    environment:
      MUNIN_MCP_HOST: 0.0.0.0
      MUNIN_MCP_PORT: 8890
      MUNIN_ALLOWED_ORIGINS: ${MUNIN_ALLOWED_ORIGINS:?set_MUNIN_ALLOWED_ORIGINS}
      MUNIN_MASTER_KEY: ${MUNIN_MASTER_KEY:?set_MUNIN_MASTER_KEY}
    command: ["munin", "production-api", "--host", "0.0.0.0", "--port", "8787"]
    depends_on:
      munin:
        condition: service_started
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - munin

volumes:
  openldap_data:
  openldap_config:

networks:
  munin:
    driver: bridge
