name: Valravn Mesh E2E

on:
  pull_request:
    paths:
      - "munin/valravn/**"
      - "munin/core/autonomy/skill_library.py"
      - "munin/mcp/main.py"
      - "munin/mcp/tools/valravn_mesh_tool.py"
      - "munin/mcp/tools/valravn_tool.py"
      - "munin/mcp/tools/burp_tool.py"
      - "munin/mcp/tools/__init__.py"
      - "munin/mcp/capabilities.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "valravn/arsenal/**"
      - "valravn/burp-extension/**"
      - "valravn/.claude/skills/**"
      - "valravn/scripts/start-burp-headless.sh"
      - "scripts/valravn_mesh_e2e.py"
      - "scripts/valravn_burp_juiceshop_e2e.py"
      - "tests/test_valravn_mesh.py"
      - "tests/test_valravn_skill_adapter.py"
      - "tests/test_burp_resilience.py"
      - "tests/fixtures/mock_*_mcp.py"
      - ".github/workflows/valravn-mesh-e2e.yml"
  push:
    branches:
      - main
      - raven-mind/integrate-valravn
      - agent/valravn-unified-security-mesh
    paths:
      - "munin/valravn/**"
      - "munin/core/autonomy/skill_library.py"
      - "munin/mcp/main.py"
      - "munin/mcp/tools/valravn_mesh_tool.py"
      - "munin/mcp/tools/valravn_tool.py"
      - "munin/mcp/tools/burp_tool.py"
      - "munin/mcp/tools/__init__.py"
      - "munin/mcp/capabilities.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "valravn/arsenal/**"
      - "valravn/burp-extension/**"
      - "valravn/.claude/skills/**"
      - "valravn/scripts/start-burp-headless.sh"
      - "scripts/valravn_mesh_e2e.py"
      - "scripts/valravn_burp_juiceshop_e2e.py"
      - "tests/test_valravn_mesh.py"
      - "tests/test_valravn_skill_adapter.py"
      - "tests/test_burp_resilience.py"
      - "tests/fixtures/mock_*_mcp.py"
      - ".github/workflows/valravn-mesh-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-e2e:
    name: Munin -> Valravn -> MCP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Munin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Munin in declared Poetry environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Clone pinned FuzzingLabs Security Hub
        run: |
          git clone --filter=blob:none https://github.com/FuzzingLabs/mcp-security-hub.git "$RUNNER_TEMP/mcp-security-hub"
          git -C "$RUNNER_TEMP/mcp-security-hub" checkout --detach b6800740da9965e9dd3fde2ec3cf4c775c358f72
          poetry run python -m pip install -r "$RUNNER_TEMP/mcp-security-hub/web-security/nuclei-mcp/requirements.txt"

      - name: Validate all 38 Arsenal mappings against upstream
        env:
          SECURITY_HUB_ROOT: ${{ runner.temp }}/mcp-security-hub
        run: |
          poetry run python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('valravn/arsenal/security_hub.json').read_text())
          root = Path(os.environ['SECURITY_HUB_ROOT'])
          assert manifest['upstream_commit'] == 'b6800740da9965e9dd3fde2ec3cf4c775c358f72'
          assert len(manifest['servers']) == 38, len(manifest['servers'])
          missing = [item['path'] for item in manifest['servers'] if not (root / item['path']).exists()]
          assert not missing, f'manifest paths missing upstream: {missing}'
          print('validated', len(manifest['servers']), 'Valravn Arsenal mappings')
          PY
          docker compose -f "$RUNNER_TEMP/mcp-security-hub/docker-compose.yml" config --quiet

      - name: Unit and regression tests
        run: |
          poetry run pytest -q \
            tests/test_valravn_mesh.py \
            tests/test_valravn_skill_adapter.py \
            tests/test_burp_resilience.py

      - name: Full protocol E2E with real Security Hub Nuclei MCP
        run: |
          poetry run python scripts/valravn_mesh_e2e.py \
            --security-hub-nuclei "$RUNNER_TEMP/mcp-security-hub/web-security/nuclei-mcp/server.py"

  burp-juice-shop-lab:
    name: Headless Burp -> OWASP Juice Shop lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      juice-shop:
        image: bkimminich/juice-shop:v20.1.1
        ports:
          - 3000:3000

    steps:
      - name: Checkout Munin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21 for Burp and Montoya extension
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Munin runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Wait for OWASP Juice Shop
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Juice Shop did not become ready" >&2
          exit 1

      - name: Download, configure, and start Burp headlessly
        env:
          BURP_HOME: ${{ runner.temp }}/valravn-burp
          BURP_API_HOST: 127.0.0.1
          BURP_API_PORT: "8111"
          BURP_PROXY_HOST: 127.0.0.1
          BURP_PROXY_PORT: "8080"
          BURP_MAX_HEAP: 2g
        run: |
          chmod +x valravn/scripts/start-burp-headless.sh
          valravn/scripts/start-burp-headless.sh
          curl -fsS http://127.0.0.1:8111/api/health

      - name: Prove Munin traffic traverses real Burp Proxy into Juice Shop
        env:
          BURP_HOME: ${{ runner.temp }}/valravn-burp
          BURP_API_HOST: 127.0.0.1
          BURP_API_PORT: "8111"
          BURP_PROXY_HOST: 127.0.0.1
          BURP_PROXY_PORT: "8080"
          JUICE_SHOP_URL: http://127.0.0.1:3000
        run: |
          poetry run python scripts/valravn_burp_juiceshop_e2e.py

      - name: Upload Burp runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valravn-burp-juice-shop-log
          path: ${{ runner.temp }}/valravn-burp/burp.log
          if-no-files-found: warn

      - name: Stop headless Burp
        if: always()
        env:
          BURP_HOME: ${{ runner.temp }}/valravn-burp
        run: |
          if [ -f "$BURP_HOME/burp.pid" ]; then
            BURP_PID="$(cat "$BURP_HOME/burp.pid")"
            kill "$BURP_PID" 2>/dev/null || true
          fi

  ultimate-upstream-contract:
    name: burp-mcp-ultimate upstream contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Ultimate provider
        uses: actions/checkout@v4
        with:
          repository: 3ntr0pyX/burp-mcp-ultimate
          ref: 1c2ffc541e15d7fcd45d750485e23b979e875295
          path: ultimate
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run upstream tests and build extension
        working-directory: ultimate
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          grep -q "MIT License" LICENSE

  awesome-upstream-contract:
    name: burp-awesome-mcp upstream contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Awesome provider
        uses: actions/checkout@v4
        with:
          repository: vvvvvvvvvvel/burp-awesome-mcp
          ref: 4d6b8c1aaccaf56e383430790fa67c463f83d72f
          path: awesome
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run upstream tests and build extension
        working-directory: awesome
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          grep -q "MIT License" LICENSE

  gate:
    name: Valravn Mesh required gate
    if: always()
    needs:
      - mesh-e2e
      - burp-juice-shop-lab
      - ultimate-upstream-contract
      - awesome-upstream-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require every mesh job
        run: |
          test "${{ needs.mesh-e2e.result }}" = "success"
          test "${{ needs.burp-juice-shop-lab.result }}" = "success"
          test "${{ needs.ultimate-upstream-contract.result }}" = "success"
          test "${{ needs.awesome-upstream-contract.result }}" = "success"
