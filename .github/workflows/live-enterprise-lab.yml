# Real operator-driven Munin session against an isolated enterprise lab.
# Targets live only on the private GitHub Actions job network.

name: Munin Enterprise Lab Session

on:
  pull_request:
    paths:
      - ".github/workflows/live-enterprise-lab.yml"
      - "scripts/ldap_seed/70-enterprise-lab.ldif"
      - "scripts/ldap_seed/71-enterprise-links.ldif"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Interactive lab duration in minutes (max 240)"
        required: true
        default: "90"
        type: number
      preflight_policy:
        description: "OPSEC preflight policy"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "active_only"
          - "always"
      munin_max_iterations:
        description: "MUNIN_MAX_ITERATIONS — blank keeps the runtime default"
        required: false
        default: ""
        type: string
      persist_state:
        description: "Restore and upload Munin durable state"
        required: true
        default: true
        type: boolean
      open_web_gui:
        description: "Launch and expose the authenticated Munin GUI"
        required: true
        default: true
        type: boolean
      tunnel_provider:
        description: "GUI tunnel provider"
        required: true
        default: "auto"
        type: choice
        options:
          - "auto"
          - "ngrok"
          - "cloudflared"
          - "localhost-run"

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  validate_definition:
    name: Validate enterprise lab definition
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate LDAP fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          additions = Path("scripts/ldap_seed/70-enterprise-lab.ldif").read_text(encoding="utf-8")
          changes = Path("scripts/ldap_seed/71-enterprise-links.ldif").read_text(encoding="utf-8")

          def records(text):
              parsed, current = [], []
              for raw in text.splitlines() + [""]:
                  line = raw.rstrip()
                  if not line:
                      if current:
                          parsed.append(current)
                          current = []
                      continue
                  if not line.startswith("#"):
                      current.append(line)
              return parsed

          add_records = records(additions)
          dns = []
          for record in add_records:
              fields = {}
              for line in record:
                  if ": " not in line:
                      raise SystemExit(f"invalid LDIF line: {line!r}")
                  key, value = line.split(": ", 1)
                  fields.setdefault(key, []).append(value)
              if "dn" not in fields or "objectClass" not in fields:
                  raise SystemExit(f"addition lacks dn/objectClass: {record!r}")
              dns.append(fields["dn"][0])

          if len(dns) != len(set(dns)):
              raise SystemExit("duplicate DN in enterprise additions")

          change_records = records(changes)
          for record in change_records:
              rendered = "\n".join(record)
              if "changetype: modify" not in rendered or "add: member" not in rendered:
                  raise SystemExit(f"unexpected relationship record: {record!r}")

          required = {
              "uid=svc_juice,ou=Service-Accounts,ou=Corp,dc=akatsuki,dc=com",
              "cn=JUICE01,ou=computers,dc=akatsuki,dc=com",
              "cn=Tier-0 Automation,ou=groups,dc=akatsuki,dc=com",
              "cn=Production Deployers,ou=groups,dc=akatsuki,dc=com",
          }
          missing = sorted(required - set(dns))
          if missing:
              raise SystemExit(f"required fixtures missing: {missing}")

          print(f"validated {len(add_records)} additions and {len(change_records)} relationship changes")
          PY

      - name: Validate workflow invariants
        run: |
          grep -q 'bkimminich/juice-shop:v20.0.0' .github/workflows/live-enterprise-lab.yml
          grep -q 'scripts/restore_munin_artifact.py' .github/workflows/live-enterprise-lab.yml
          grep -q 'Prove Munin MCP reaches the expanded lab' .github/workflows/live-enterprise-lab.yml
          grep -q 'find_kerberoastable_users' .github/workflows/live-enterprise-lab.yml
          grep -q 'find_asrep_roastable_users' .github/workflows/live-enterprise-lab.yml

  enterprise_lab:
    name: "Munin enterprise lab (${{ inputs.duration_minutes }}min)"
    needs: validate_definition
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    container:
      image: kalilinux/kali-rolling
      options: --user root

    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "AKATSUKI"
          LDAP_DOMAIN: "akatsuki.com"
          LDAP_BASE_DN: "dc=akatsuki,dc=com"
          LDAP_ADMIN_PASSWORD: "itachi"
          LDAP_CONFIG_PASSWORD: "itachi"
          LDAP_TLS: "false"
        ports:
          - 389:389
      apache:
        image: httpd:2.4.49
      juiceshop:
        image: bkimminich/juice-shop:v20.0.0

    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      MUNIN_MCP_AUTH_TOKEN: ${{ secrets.MUNIN_MCP_AUTH_TOKEN }}
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY || '000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f' }}
      MUNIN_ALLOWED_ORIGINS: "http://127.0.0.1:3000"
      MUNIN_COOKIE_SECURE: "1"
      MUNIN_PRODUCTION_API_URL: "http://127.0.0.1:8787"
      MUNIN_PRODUCTION_PROXY_ORIGIN: "http://127.0.0.1:3000"
      MUNIN_INSTANCE_ID: "github-enterprise-lab-${{ github.run_id }}-${{ github.run_attempt }}"
      LDAP_URI: "ldap://ldap:389"
      LDAP_BASE_DN: "dc=akatsuki,dc=com"
      LDAP_BIND_DN: "cn=admin,dc=akatsuki,dc=com"
      LDAP_PASSWORD: "itachi"
      PREFLIGHT_POLICY: ${{ inputs.preflight_policy }}
      MUNIN_MAX_ITERATIONS: ${{ inputs.munin_max_iterations }}
      MUNIN_LOG_LEVEL: ${{ vars.MUNIN_LOG_LEVEL || 'INFO' }}
      LLM_TIMEOUT_FLOOR: "40"
      LLM_TIMEOUT_CEILING: "240"
      LLM_RETRY_ATTEMPTS: "5"
      LLM_RETRY_BASE_DELAY: "5"
      LLM_RETRY_MAX_DELAY: "60"
      MUNIN_SSE_MAX_SECONDS: "14400"
      MUNIN_SSE_HEARTBEAT_SECONDS: "20"
      MUNIN_AUTO_COMMIT: "1"
      MUNIN_AUTO_PR: "1"
      MUNIN_GIT_USER: "munin-bot"
      MUNIN_GIT_EMAIL: "munin-bot@users.noreply.github.com"
      MUNIN_GIT_BRANCH: "munin/enterprise-lab-${{ github.run_id }}"
      MUNIN_PR_BASE_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      MUNIN_LAB_WEB_URL: "http://juiceshop:3000"
      MUNIN_LAB_WEB_HOST: "juiceshop"
      MUNIN_LAB_WEB_PORT: "3000"
      MUNIN_SMOKE_LDAP_TARGET: "ldap"
      MUNIN_SMOKE_APACHE_TARGET: "apache"
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      MUNIN_TUNNEL_PROVIDER: ${{ inputs.tunnel_provider }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Munin runtime and offensive toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
              python3 python3-pip python3-venv python3-poetry \
              ca-certificates curl git jq openssh-client pipx ldap-utils nodejs npm \
              build-essential libldap2-dev libsasl2-dev libssl-dev golang-go \
              nmap nuclei feroxbuster ffuf sqlmap hydra smbmap netexec \
              httpx-toolkit exploitdb eyewitness

          GH_VERSION="2.96.0"
          GH_ARCHIVE="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${GH_ARCHIVE}"
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_checksums.txt"
          grep " ${GH_ARCHIVE}$" "gh_${GH_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${GH_ARCHIVE}" -C /tmp
          install "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          rm -f "${GH_ARCHIVE}" "gh_${GH_VERSION}_checksums.txt"

          ln -sf /usr/bin/httpx-toolkit /usr/local/bin/pd-httpx
          if command -v eyewitness >/dev/null 2>&1 && ! command -v EyeWitness >/dev/null 2>&1; then
              ln -s "$(command -v eyewitness)" /usr/local/bin/EyeWitness
          fi
          if ! command -v katana >/dev/null 2>&1; then
              GOBIN=/usr/local/bin go install github.com/projectdiscovery/katana/cmd/katana@latest
          fi
          if ! command -v poetry >/dev/null 2>&1; then
              pipx install poetry
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Restore Munin durable files from the latest trusted session
        if: ${{ inputs.persist_state }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MUNIN_RESTORE_ALLOWED_ACTORS: ${{ vars.MUNIN_RESTORE_ALLOWED_ACTORS || github.repository_owner }}
        run: |
          python3 scripts/restore_munin_artifact.py \
            --workflow live-enterprise-lab.yml \
            --artifact munin-state \
            --branch "$GITHUB_REF_NAME" \
            --allowed-actor "$MUNIN_RESTORE_ALLOWED_ACTORS" \
            --destination "$GITHUB_WORKSPACE"

      - name: Prepare workspace and verify toolchain
        run: |
          for directory in /home/user /home/runner reports evidence data soul; do
              mkdir -p "$directory"
          done
          chmod 0777 /home/user /home/runner 2>/dev/null || true

          missing=0
          for binary in curl jq ldapsearch ldapmodify nmap nuclei feroxbuster ffuf \
                        sqlmap hydra smbmap netexec katana pd-httpx searchsploit EyeWitness; do
              command -v "$binary" >/dev/null 2>&1 || missing=$((missing + 1))
          done
          test "$missing" -eq 0
          nuclei -silent -ut 2>/dev/null || true

      - name: Install Munin and verify Turso
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi
          test -n "$MUNIN_DB_URL"
          test -n "$MUNIN_DB_AUTH_TOKEN"
          case "$MUNIN_DB_URL" in libsql://*|libsqls://*) ;; *) exit 1 ;; esac
          poetry run python scripts/turso_smoke.py

      - name: Wait for LDAP
        run: |
          for attempt in $(seq 1 45); do
              if ldapsearch -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
                    -b "$LDAP_BASE_DN" "(objectClass=*)" dn 2>/dev/null | grep -q "result: 0"; then
                  exit 0
              fi
              sleep 1
          done
          echo "::error::LDAP service did not become ready" >&2
          exit 1

      - name: Seed complex enterprise LDAP
        run: |
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -f scripts/ldap_mock.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -f scripts/ldap_seed/60-web-lab.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -f scripts/ldap_seed/70-enterprise-lab.ldif
          ldapmodify -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -f scripts/ldap_seed/71-enterprise-links.ldif

      - name: Validate LDAP graph and attack-path fixtures
        run: |
          ldapsearch -LLL -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -b "$LDAP_BASE_DN" "(objectClass=*)" \
              dn uid cn title employeeType description member owner objectClass \
              > /tmp/enterprise-directory.ldif

          for expected in \
            '^dn: cn=JUICE01,ou=computers,dc=akatsuki,dc=com$' \
            '^uid: svc_juice$' \
            '^title: HTTP/JUICE01.akatsuki.com:3000$' \
            '^uid: breakglass_audit$' \
            '^member: cn=Tier-0 Automation,ou=groups,dc=akatsuki,dc=com$' \
            '^member: cn=Production Deployers,ou=groups,dc=akatsuki,dc=com$' \
            '^member: uid=vendor_zen,ou=Contractors,ou=Corp,dc=akatsuki,dc=com$'; do
              grep -q "$expected" /tmp/enterprise-directory.ldif
          done

          people=$(grep -c '^objectClass: inetOrgPerson$' /tmp/enterprise-directory.ldif || true)
          groups=$(grep -c '^objectClass: groupOfNames$' /tmp/enterprise-directory.ldif || true)
          devices=$(grep -c '^objectClass: device$' /tmp/enterprise-directory.ldif || true)
          spns=$(grep -Ec '^title: [A-Za-z0-9_-]+/.+' /tmp/enterprise-directory.ldif || true)
          asrep=$(grep -c '^employeeType: DONT_REQ_PREAUTH$' /tmp/enterprise-directory.ldif || true)

          test "$people" -ge 20
          test "$groups" -ge 18
          test "$devices" -ge 14
          test "$spns" -ge 10
          test "$asrep" -ge 4

          {
            echo "LDAP_PEOPLE=${people}"
            echo "LDAP_GROUPS=${groups}"
            echo "LDAP_DEVICES=${devices}"
            echo "LDAP_SPNS=${spns}"
            echo "LDAP_ASREP=${asrep}"
          } >> "$GITHUB_ENV"

      - name: Wait for vulnerable web targets
        run: |
          for attempt in $(seq 1 90); do
              if curl -fsS "$MUNIN_LAB_WEB_URL/" -o /tmp/juice-shop-index.html; then
                  grep -Eqi 'juice|app-root|<html' /tmp/juice-shop-index.html
                  curl -fsSI "$MUNIN_LAB_WEB_URL/" > /tmp/juice-shop-headers.txt
                  break
              fi
              test "$attempt" -lt 90 || exit 1
              sleep 2
          done
          for attempt in $(seq 1 45); do
              curl -fsSI http://apache:80/ >/dev/null && exit 0
              test "$attempt" -lt 45 || exit 1
              sleep 1
          done

      - name: Start unified Munin server
        run: |
          bind_host="127.0.0.1"
          if [ "${{ inputs.open_web_gui }}" = "true" ]; then bind_host="0.0.0.0"; fi
          nohup env PYTHONUNBUFFERED=1 RUNNER_TRACKING_ID="" \
              poetry run munin serve --host "$bind_host" --port 8787 \
              </dev/null > /tmp/munin.log 2>&1 &
          echo $! > /tmp/munin.pid
          for attempt in $(seq 1 45); do
              curl -fsS http://127.0.0.1:8787/health >/dev/null && exit 0
              if ! kill -0 "$(cat /tmp/munin.pid)" 2>/dev/null; then
                  cat /tmp/munin.log
                  exit 1
              fi
              sleep 1
          done
          cat /tmp/munin.log
          exit 1

      - name: Prove Munin MCP reaches the expanded lab
        run: |
          poetry run python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          endpoint = "http://127.0.0.1:8787/mcp/"
          token = os.environ["MUNIN_MCP_AUTH_TOKEN"]
          session_id = ""

          def read_rpc(response):
              raw = response.read().decode("utf-8", errors="replace")
              if "application/json" in response.headers.get("content-type", ""):
                  return json.loads(raw)
              for line in raw.splitlines():
                  if line.startswith("data: "):
                      return json.loads(line[6:])
              raise RuntimeError(raw[:500])

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({
                      "jsonrpc": "2.0", "id": 1, "method": "initialize",
                      "params": {
                          "protocolVersion": "2024-11-05", "capabilities": {},
                          "clientInfo": {"name": "enterprise-lab-smoke", "version": "1.0"},
                      },
                  }).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      session_id = response.headers.get("mcp-session-id", "")
                      read_rpc(response)
                  if session_id:
                      break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(2)
          if not session_id:
              raise RuntimeError("MCP initialize returned no session id")

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "mcp-session-id": session_id,
          }

          def rpc(request_id, method, params, timeout=120):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"jsonrpc": "2.0", "id": request_id, "method": method, "params": params}).encode(),
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  message = read_rpc(response)
              if message.get("error"):
                  raise RuntimeError(message["error"])
              return message

          def tool(request_id, name, arguments):
              message = rpc(request_id, "tools/call", {"name": name, "arguments": arguments})
              result = message.get("result", {})
              if result.get("isError"):
                  raise RuntimeError(result)
              text = "".join(str(c.get("text", "")) for c in result.get("content", []) if c.get("type") == "text")
              payload = json.loads(text)
              if not payload.get("ok"):
                  raise RuntimeError(payload)
              return payload

          tools = {item.get("name") for item in rpc(2, "tools/list", {}).get("result", {}).get("tools", [])}
          required = {"nmap_scan", "httpx_probe", "ldap_search", "find_kerberoastable_users", "find_asrep_roastable_users"}
          if required - tools:
              raise RuntimeError(f"missing tools: {sorted(required - tools)}")

          nmap = tool(3, "nmap_scan", {
              "target": os.environ["MUNIN_LAB_WEB_HOST"], "scan_type": "-sV",
              "ports": os.environ["MUNIN_LAB_WEB_PORT"], "additional_args": "-Pn",
              "mode": "sync", "timeout": 90, "run_id": "enterprise-lab-nmap",
          })
          if "3000/tcp" not in json.dumps(nmap):
              raise RuntimeError("nmap did not confirm Juice Shop port 3000")

          tool(4, "httpx_probe", {
              "targets": os.environ["MUNIN_LAB_WEB_URL"], "mode": "sync",
              "timeout": 90, "run_id": "enterprise-lab-httpx",
          })

          ldap = tool(5, "ldap_search", {
              "filter_template": "(&(objectClass=inetOrgPerson)(uid=svc_juice))",
              "attributes_csv": "uid,cn,title,description", "size_limit": 10,
              "run_id": "enterprise-lab-ldap",
          })
          rendered = json.dumps(ldap)
          if "svc_juice" not in rendered or "JUICE01" not in rendered:
              raise RuntimeError("LDAP application correlation fixture missing")

          kerberoast = tool(6, "find_kerberoastable_users", {"run_id": "enterprise-lab-spn"})
          if "svc_juice" not in json.dumps(kerberoast):
              raise RuntimeError("svc_juice missing from SPN enumeration")

          asrep = tool(7, "find_asrep_roastable_users", {"run_id": "enterprise-lab-asrep"})
          rendered = json.dumps(asrep)
          if "breakglass_audit" not in rendered or "legacy_batch" not in rendered:
              raise RuntimeError("enterprise AS-REP fixtures missing")

          print("OK — Munin reached Juice Shop and correlated the expanded LDAP environment")
          PY

      - name: Exercise existing full MCP lab contract
        run: |
          MUNIN_SMOKE_BASE_URL=http://127.0.0.1:8787 \
            poetry run python scripts/ci_live_smoke.py --require-turso

      - name: Build and start Munin web GUI
        if: ${{ inputs.open_web_gui }}
        working-directory: app
        env:
          NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN: "1"
          MUNIN_GUI_SERVER_AUTH_PROXY: "1"
        run: |
          npm ci --no-audit
          npm run build
          nohup env RUNNER_TRACKING_ID="" NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN=1 \
              MUNIN_GUI_SERVER_AUTH_PROXY=1 npm run start -- --hostname 0.0.0.0 --port 3000 \
              </dev/null > /tmp/munin-gui.log 2>&1 &
          echo $! > /tmp/munin-gui.pid
          for attempt in $(seq 1 45); do
              curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
              if ! kill -0 "$(cat /tmp/munin-gui.pid)" 2>/dev/null; then
                  cat /tmp/munin-gui.log
                  exit 1
              fi
              sleep 1
          done
          exit 1

      - name: Verify and expose authenticated GUI
        if: ${{ inputs.open_web_gui }}
        run: |
          MUNIN_SMOKE_BASE_URL=http://127.0.0.1:3000 \
            poetry run python scripts/ci_live_smoke.py --proxy-only --require-turso
          MUNIN_TUNNEL_PROVIDER="${{ inputs.tunnel_provider }}" \
            bash scripts/open_tunnel.sh 3000 MUNIN_GUI_URL /tmp/gui-tunnel.log
          test -n "${MUNIN_GUI_URL:-}"
          origin="${MUNIN_GUI_URL%/}"
          echo "MUNIN_ALLOWED_ORIGINS=${MUNIN_ALLOWED_ORIGINS},${origin}" >> "$GITHUB_ENV"
          echo "MUNIN_PRODUCTION_PROXY_ORIGIN=${origin}" >> "$GITHUB_ENV"

      - name: Publish operator briefing
        run: |
          gui_url="${MUNIN_GUI_URL:-http://127.0.0.1:3000}"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Munin enterprise laboratory

          | Component | Authorized coordinate |
          |---|---|
          | Munin GUI | \`${gui_url}\` |
          | Vulnerable web box | \`http://juiceshop:3000\` |
          | Directory | \`ldap://ldap:389\` / \`dc=akatsuki,dc=com\` |
          | Legacy web fixture | \`http://apache:80\` |
          | LDAP identities | \`${LDAP_PEOPLE}\` |
          | LDAP groups | \`${LDAP_GROUPS}\` |
          | LDAP devices | \`${LDAP_DEVICES}\` |
          | SPN-like identities | \`${LDAP_SPNS}\` |
          | DONT_REQ_PREAUTH identities | \`${LDAP_ASREP}\` |

          Suggested objective:

          > Investigate the authorized AKATSUKI laboratory as an unknown enterprise
          > environment. Enumerate exposed services, correlate application and directory
          > evidence, identify credible attack paths, validate findings without denial
          > of service or container escape, and produce an evidence-backed report that
          > separates confirmed facts, inferences and unknowns.

          Only \`juiceshop\`, \`ldap\` and \`apache\` are authorized targets.
          SUMMARY

      - name: Keep interactive session alive
        run: |
          minutes=${{ inputs.duration_minutes }}
          if [ "$minutes" -gt 240 ]; then minutes=240; fi
          end=$(( $(date +%s) + minutes * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
              echo "[munin][enterprise-lab] $(date -u +%FT%TZ) — $(( (end - $(date +%s)) / 60 ))m remaining"
              curl -fsS http://127.0.0.1:8787/health >/dev/null || echo "::warning::Munin health failed"
              curl -fsS "$MUNIN_LAB_WEB_URL/" >/dev/null || echo "::warning::Juice Shop health failed"
              sleep 300
          done

      - name: Session logs
        if: always()
        run: |
          tail -200 /tmp/munin.log 2>/dev/null || true
          tail -100 /tmp/munin-gui.log 2>/dev/null || true
          cat /tmp/gui-tunnel.log 2>/dev/null || true

      - name: Stop detached subagents
        if: always()
        run: poetry run python -m munin.subagents.process_control --timeout 15

      - name: Stop Munin cleanly
        if: always()
        run: |
          for pid_file in /tmp/munin-gui.pid /tmp/munin.pid; do
              pid=$(cat "$pid_file" 2>/dev/null || true)
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                  kill -TERM "$pid" 2>/dev/null || true
                  for _ in $(seq 1 15); do
                      kill -0 "$pid" 2>/dev/null || break
                      sleep 1
                  done
                  kill -KILL "$pid" 2>/dev/null || true
              fi
          done

      - name: Final git push for generated capabilities
        if: always() && env.MUNIN_AUTO_COMMIT == '1'
        run: |
          git config user.name "$MUNIN_GIT_USER"
          git config user.email "$MUNIN_GIT_EMAIL"
          git add munin/generated/ soul/ data/soul_pending/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
              git commit -m "[munin][enterprise-lab] persist generated artifacts (${GITHUB_RUN_ID})" || true
          fi
          git checkout -B "$MUNIN_GIT_BRANCH" 2>/dev/null || true
          git push -u origin "$MUNIN_GIT_BRANCH" || echo "final push failed (non-fatal)"

      - name: Upload Munin durable state
        if: always() && inputs.persist_state
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: munin-state
          path: |
            data/shared_state.sqlite
            data/shared_state.sqlite-wal
            data/shared_state.sqlite-shm
            data/soul_pending/
            data/wake_artifacts/
            munin/generated/
            reports/
            evidence/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload enterprise-lab diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: munin-enterprise-lab-${{ github.run_id }}
          path: |
            /tmp/munin.log
            /tmp/munin-gui.log
            /tmp/gui-tunnel.log
            /tmp/juice-shop-index.html
            /tmp/juice-shop-headers.txt
            /tmp/enterprise-directory.ldif
            data/events.jsonl
          retention-days: 7
          if-no-files-found: warn
