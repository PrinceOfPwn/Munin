name: Patch ROGUE prompt documentation

on:
  push:
    branches:
      - agent/document-rogue-prompt-design

permissions:
  contents: write

jobs:
  patch-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/document-rogue-prompt-design
          fetch-depth: 0

      - name: Insert prompt design section
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          heading = "## Prompt design: ROGUE lab profile and Chinese control language"
          if heading in text:
              raise SystemExit(0)

          marker = "> [!WARNING]\n> **Authorised use only.** Munin is designed for legitimate security research, threat intelligence and controlled red-team operations. You are responsible for obtaining permission, defining scope, protecting credentials, reviewing impact and complying with applicable law. A working deployment or successful tool call does not establish authorisation.\n"
          if marker not in text:
              raise SystemExit("README authorisation warning marker not found")

          section = r'''

## Prompt design: ROGUE lab profile and Chinese control language

> [!CAUTION]
> Munin's research prompts are designed in **ROGUE mode by default** to stress-test agentic planning, tool use, delegation, persistence and recovery inside an **isolated, explicitly authorised laboratory**. In this documentation, ROGUE means an aggressive capability-evaluation profile—not permission to target third parties, bypass runtime policy or exceed the operator's written scope. Identity, approvals, capability policy, audit events and hard execution boundaries remain authoritative.

The control prompts use **Simplified Chinese** for much of their internal instruction surface. Chinese can express dense operational constraints with fewer characters and less visual repetition, and Chinese-developed model families are commonly pretrained and evaluated heavily on Chinese as well as English. For those models, native-language instructions can sometimes improve instruction fidelity, planning vocabulary and stability during long agentic runs.

This is **not** a universal claim that Chinese always consumes fewer tokens or always performs better. Token efficiency depends on the exact tokenizer and model. A 2026 SWE-bench study found language effects to be model-dependent—GLM-5 used fewer tokens in Chinese, while other tested models did not—and reported lower Chinese success rates overall in its tested setup. Munin therefore treats Chinese as an empirically selected control language for this prompt suite, not as a general optimisation rule.

### Internal validation matrix

The ROGUE prompt profile and Chinese control-language variants have been exercised internally with:

- **Kimi K3**
- **DeepSeek V4 Pro**
- **DeepSeek V4 Flash 0731**
- **LongCat**
- **MiMo V2.5 Pro**
- **NVIDIA Nemotron Ultra**
- **OffX 9B**

This list records compatibility testing, not equivalent capability, safety or benchmark performance across models. Provider versions can change, so production use should repeat tool-calling, persistence and scoped-execution validation against the exact deployed model.

### References

- [Chinese Language Is Not More Efficient Than English in Vibe Coding: A Preliminary Study on Token Cost and Problem-Solving Rate](https://arxiv.org/abs/2604.14210)
- [DeepSeek-V3 Technical Report](https://arxiv.org/abs/2412.19437) — documents predominantly English-and-Chinese pretraining data and evaluation across English, Chinese and multilingual benchmarks.
- [Chinese Tiny LLM](https://arxiv.org/abs/2404.04167) — evidence that Chinese-centric pretraining can materially improve Chinese-language task performance.
- [Kimi model documentation](https://platform.kimi.ai/docs/models) — documents Kimi's agentic and coding model family.
- [DeepSeek API models and pricing](https://api-docs.deepseek.com/quick_start/pricing) — current V4 Pro and V4 Flash model identifiers and capabilities.
- [LongCat official repositories](https://github.com/meituan-longcat) — official model and technical-report implementations from the LongCat team.
- [MiMo model releases](https://mimo.mi.com/docs/zh-CN/updates/model) — official MiMo V2.5 Pro and agent-capability release notes.
- [NVIDIA Nemotron 3 Ultra](https://research.nvidia.com/labs/nemotron/Nemotron-3-Ultra/) — official agentic reasoning model and technical report.
'''

          path.write_text(text.replace(marker, marker + section, 1), encoding="utf-8")

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document ROGUE prompt design and model validation"
          git push origin HEAD:agent/document-rogue-prompt-design
