name: Valravn Smoke

on:
  workflow_dispatch:
    inputs:
      probe_external_apis:
        description: "Probe configured reconnaissance APIs"
        required: false
        default: false
        type: boolean
      probe_browser:
        description: "Launch CloakBrowser and capture example.com"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "munin/valravn/**"
      - "munin/mcp/tools/valravn_tool.py"
      - "munin/mcp/tools/valravn_mesh_tool.py"
      - "munin/mcp/tools/tavily_tool.py"
      - "munin/mcp/capabilities.py"
      - "soul/valravn.md"
      - "valravn/**"
      - "tests/test_valravn_integration.py"
      - "tests/test_valravn_mesh.py"
      - "scripts/valravn_protocol_smoke.py"
      - ".github/workflows/valravn-smoke.yml"
  pull_request:
    paths:
      - "munin/valravn/**"
      - "munin/mcp/tools/valravn_tool.py"
      - "munin/mcp/tools/valravn_mesh_tool.py"
      - "munin/mcp/tools/tavily_tool.py"
      - "munin/mcp/capabilities.py"
      - "soul/valravn.md"
      - "valravn/**"
      - "tests/test_valravn_integration.py"
      - "tests/test_valravn_mesh.py"
      - "scripts/valravn_protocol_smoke.py"
      - ".github/workflows/valravn-smoke.yml"

permissions:
  contents: write

jobs:
  valravn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Munin
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction
      - name: Compile Valravn runtime
        run: poetry run python -m compileall -q munin/valravn munin/mcp/tools/valravn_tool.py munin/mcp/tools/valravn_mesh_tool.py
      - name: Protocol smoke
        run: poetry run python scripts/valravn_protocol_smoke.py
      - name: Catalog smoke
        env:
          MUNIN_WORKSPACE: ${{ github.workspace }}
          VALRAVN_RESOLVE_PUBLIC_HOSTS: "false"
        run: |
          poetry run python - <<'PY'
          from munin.valravn.gateway import ValravnGateway
          status = ValravnGateway().status(probe=False)
          assert status["name"] == "Valravn"
          assert status["sources"]["ripestat"]
          assert status["sources"]["wayback"]
          assert status["sources"]["commoncrawl"]
          print(status)
          PY
      - name: Valravn integration tests
        run: poetry run pytest -q tests/test_valravn_integration.py tests/test_valravn_mesh.py
      - name: Existing Munin tests
        run: poetry run pytest -q
      - name: External API probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_external_apis }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          LEAKIX_API_KEY: ${{ secrets.LEAKIX_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          VALRAVN_RESOLVE_PUBLIC_HOSTS: "false"
        run: |
          poetry run python - <<'PY'
          from munin.valravn.gateway import ValravnGateway
          g = ValravnGateway()
          print(g.investigate_network("AS3333", depth="quick"))
          print(g.search_historical_web("example.com", limit=5, depth="quick"))
          print(g.investigate_ioc("1.1.1.1", depth="quick"))
          PY
      - name: Install optional CloakBrowser runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_browser }}
        run: poetry run pip install cloakbrowser==0.5.3
      - name: CloakBrowser probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_browser }}
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          VALRAVN_BROWSER_ENABLED: "true"
          VALRAVN_RESOLVE_PUBLIC_HOSTS: "true"
        run: |
          poetry run python - <<'PY'
          import tempfile
          from pathlib import Path
          from munin.valravn.config import ValravnSettings
          from munin.valravn.gateway import ValravnGateway
          with tempfile.TemporaryDirectory() as d:
              settings = ValravnSettings.from_env()
              object.__setattr__(settings, "workspace_root", Path(d))
              result = ValravnGateway(settings).capture_web_evidence("https://example.com", run_id="browser-smoke")
              assert result["artifacts"]
              print(result["summary"])
          PY

  valravn-assets:
    name: Valravn skills + knowledge assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate preserved skills and knowledge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skills = sorted(Path("valravn/.claude/skills").glob("*.md"))
          agents = sorted(Path("valravn/.claude/agents").glob("*.md"))
          kb = sorted(Path("valravn/mcp-server/src/burpsuite_mcp/knowledge").glob("*.json"))
          payloads = sorted(Path("valravn/mcp-server/src/burpsuite_mcp/payloads").rglob("*.json"))
          assert len(skills) >= 50, len(skills)
          assert len(agents) >= 10, len(agents)
          assert len(kb) >= 140, len(kb)
          for path in kb + payloads:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"preserved assets: skills={len(skills)} agents={len(agents)} kb={len(kb)} payloads={len(payloads)}")
          PY
      - name: Validate skill metadata and attribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("valravn/skill.json").read_text(encoding="utf-8"))
          assert doc["name"] == "valravn"
          assert doc["license"] == "Apache-2.0"
          ups = doc.get("upstream_attribution", {})
          notice = ups.get("notice_required_by_section_4d", {})
          assert notice.get("upstream_source", "").startswith("https://github.com/PrinceOfPwn/Valravn")
          raw_notice = Path("valravn/NOTICE").read_text(encoding="utf-8")
          assert "https://github.com/PrinceOfPwn/Valravn" in raw_notice
          print("Valravn attribution retained")
          PY
      - name: Assert legacy Burp REST bridge is gone from runtime
        run: |
          test ! -e valravn/burp-extension
          test ! -e munin/mcp/tools/burp_tool.py
          python - <<'PY'
          from munin.mcp.capabilities import CAPABILITY_PROFILES
          ids = {p["id"] for p in CAPABILITY_PROFILES}
          assert "burp_dast" not in ids, ids
          assert "valravn_talons" in ids, ids
          profile = next(p for p in CAPABILITY_PROFILES if p["id"] == "valravn_talons")
          assert "valravn_talons_call" in profile["native_tools"]
          print("Talons is the only Munin Burp execution gateway")
          PY

  finalize-unified-pr:
    name: Finalize unified runtime reconciliation
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/unified-system-issue-18' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout real head with write credentials
        uses: actions/checkout@v4
        with:
          ref: agent/unified-system-issue-18
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile store and wake semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          python - <<'PY'
          from __future__ import annotations
          import ast
          import subprocess
          from pathlib import Path

          STORE = Path("munin/production/store.py")
          ORCH = Path("munin/core/orchestrator.py")

          def git_show(spec: str) -> str:
              return subprocess.check_output(["git", "show", spec], text=True)

          def class_methods(source: str, class_name: str):
              tree = ast.parse(source)
              cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == class_name)
              methods = {n.name: n for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              return cls, methods

          def semantic(node: ast.AST) -> str:
              return ast.dump(node, include_attributes=False)

          def transplant_main_only_methods(path: Path, class_names: tuple[str, ...]) -> None:
              merge_base = subprocess.check_output(["git", "merge-base", "origin/develop", "origin/main"], text=True).strip()
              base = git_show(f"{merge_base}:{path.as_posix()}")
              main = git_show(f"origin/main:{path.as_posix()}")
              current = path.read_text(encoding="utf-8")
              for class_name in class_names:
                  _, base_methods = class_methods(base, class_name)
                  _, main_methods = class_methods(main, class_name)
                  _, cur_methods = class_methods(current, class_name)
                  main_lines = main.splitlines()
                  cur_lines = current.splitlines()
                  replacements = []
                  additions = []
                  for name, main_node in main_methods.items():
                      base_node = base_methods.get(name)
                      cur_node = cur_methods.get(name)
                      if base_node is None:
                          if cur_node is None:
                              additions.append((name, main_lines[main_node.lineno - 1: main_node.end_lineno]))
                          continue
                      if semantic(main_node) == semantic(base_node):
                          continue
                      if cur_node is not None and semantic(cur_node) == semantic(base_node):
                          replacements.append((cur_node.lineno - 1, cur_node.end_lineno, main_lines[main_node.lineno - 1: main_node.end_lineno], name))
                      elif cur_node is not None and semantic(cur_node) != semantic(main_node):
                          print(f"overlap preserved for {class_name}.{name}")
                  for start, end, replacement, name in sorted(replacements, reverse=True):
                      print(f"replaying main-only change: {class_name}.{name}")
                      cur_lines[start:end] = replacement
                  current = "\n".join(cur_lines) + "\n"
                  if additions:
                      cur_cls, _ = class_methods(current, class_name)
                      cur_lines = current.splitlines()
                      block = []
                      for name, method_lines in additions:
                          print(f"replaying main-only addition: {class_name}.{name}")
                          block.extend(["", *method_lines])
                      cur_lines[cur_cls.end_lineno:cur_cls.end_lineno] = block
                      current = "\n".join(cur_lines) + "\n"
              path.write_text(current, encoding="utf-8")

          transplant_main_only_methods(STORE, ("ProductionStore", "MuninStore"))
          source = STORE.read_text(encoding="utf-8")
          replacements = {
              '"""CREATE INDEX IF NOT EXISTS idx_tool_calls_run ON tool_calls(run_id)""",': '"""CREATE INDEX IF NOT EXISTS idx_tool_calls_run_started ON tool_calls(run_id, started_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_reasoning_events_run ON reasoning_events(run_id)""",': '"""CREATE INDEX IF NOT EXISTS idx_reasoning_events_run_created ON reasoning_events(run_id, created_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_human_requests_run ON human_requests(run_id)""",': '"""CREATE INDEX IF NOT EXISTS idx_human_requests_run_created ON human_requests(run_id, created_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_subagent_runs_parent ON subagent_runs(parent_run_id)""",': '"""CREATE INDEX IF NOT EXISTS idx_subagent_runs_parent_started ON subagent_runs(parent_run_id, started_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_conversation_artifacts_run ON conversation_artifacts(run_id)""",': '"""CREATE INDEX IF NOT EXISTS idx_conversation_artifacts_run_created ON conversation_artifacts(run_id, created_at_ms, id)""",',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"index declaration changed: {old}")
              source = source.replace(old, new)
          summaries_conv = '"""CREATE INDEX IF NOT EXISTS idx_conversation_summaries_conv ON conversation_summaries(conversation_id)""",'
          summaries_run = '"""CREATE INDEX IF NOT EXISTS idx_conversation_summaries_run_created ON conversation_summaries(run_id, created_at_ms, id)""",'
          if summaries_run not in source:
              source = source.replace(summaries_conv, summaries_conv + "\n    " + summaries_run)
          STORE.write_text(source, encoding="utf-8")

          orch_source = ORCH.read_text(encoding="utf-8")
          orch_cls, methods = class_methods(orch_source, "Orchestrator")
          wake = methods["wake"]
          lines = orch_source.splitlines()
          new_wake = '''    def wake(
        self,
        subagent_name: str,
        task: dict[str, Any],
        *,
        priority: int = 0,
        detached: bool = True,
    ) -> dict[str, Any]:
        """Queue one supervisor_v2 wake without claiming a legacy spawn slot.

        Once ``enqueue_wake`` returns a ``wake_id`` the task exists. Presence
        refresh is observability only, so a later failure is returned as a
        warning and must not make callers retry an already-enqueued task.
        """
        del detached
        normalized_name = subagent_name.strip()
        wake_id = self.state.enqueue_wake(target_agent=normalized_name, task=task, priority=priority)
        result: dict[str, Any] = {
            "wake_id": wake_id,
            "target_agent": normalized_name,
            "pid": None,
            "spawned": False,
            "queued": True,
            "presence_updated": True,
            "reason": "supervisor_v2_wake_path",
        }
        try:
            self.state.upsert_presence(
                agent_name=normalized_name,
                role="",
                status="IDLE",
                current_task_id=None,
                metadata_json=json.dumps(presence_metadata(os.getpid(), lease_seconds=0)),
            )
        except Exception as exc:  # noqa: BLE001
            logger.warning("wake %s queued as %s but presence refresh failed: %s", normalized_name, wake_id, exc)
            result["presence_updated"] = False
            result["warning"] = {"code": "presence_update_failed", "message": str(exc)}
        return result'''.splitlines()
          lines[wake.lineno - 1:wake.end_lineno] = new_wake
          orch_source = "\n".join(lines) + "\n"
          orch_source = orch_source.replace(
              "- Immediately spawn a subprocess `python -m munin.subagents.runner <name>`; the\n  subprocess claims the wake item and executes it, publishing progress via\n  `shared_intel` / `agent_messages` and finishing with `complete_shared_task`.\n- Sleep is implicit: the subprocess ends when the wake queue is empty for that agent\n  and after `sleep_after_idle_seconds` of inactivity.\n",
              "- supervisor_v2 does not spawn `munin.subagents.runner`; a connected supervisor\n  observes and claims durable wake rows. Presence updates are best-effort metadata.\n- Sleep marks presence IDLE; queued work remains durable until a supervisor claims it.\n",
          )
          ORCH.write_text(orch_source, encoding="utf-8")
          PY
          git diff --check
          python -m py_compile munin/production/store.py munin/core/orchestrator.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip poetry==2.3.2
          poetry install --no-interaction --no-ansi --sync
      - name: Validate reconciled runtime
        run: |
          poetry run ruff check --select F munin tests
          poetry run pytest -q \
            tests/test_store_indexes.py \
            tests/test_orchestrator_wake_semantics.py \
            tests/test_pr_review_regressions.py \
            tests/test_run_cancel.py \
            tests/test_cancel_sse_events.py \
            tests/test_guidance_lifecycle.py \
            tests/test_guidance_lifecycle_e2e.py \
            tests/test_artifacts_store.py \
            tests/test_artifacts_endpoints.py \
            tests/test_asgi_artifacts.py \
            tests/test_run_detail_endpoint.py \
            tests/test_sandboxed_html_registry.py \
            tests/test_sse_workflow_events.py \
            tests/test_discord_adapter.py \
            tests/test_discord_regression.py \
            tests/test_chat_recovery.py \
            tests/test_compaction.py
      - name: Publish final tree and restore workflows
        shell: bash
        run: |
          set -euo pipefail
          # Restore the exact registered Valravn workflow from this bootstrap
          # commit's parent, then remove the unregistered finalizer workflow.
          git show HEAD^:.github/workflows/valravn-smoke.yml > .github/workflows/valravn-smoke.yml
          rm -f .github/workflows/finalize-unified-pr.yml
          git add munin/production/store.py munin/core/orchestrator.py \
            .github/workflows/valravn-smoke.yml .github/workflows/finalize-unified-pr.yml
          git commit -m "fix(runtime): reconcile post-fork store and wake semantics"
          git push origin HEAD:agent/unified-system-issue-18
