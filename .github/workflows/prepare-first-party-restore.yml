name: Prepare first-party restore wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/live-command-output-stream'
    runs-on: ubuntu-latest
    steps:
      - name: Build updated live-session blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "munin-workflow-wiring",
          }

          def expression(value):
              return "$" + "{{ " + value + " }}"

          path = ".github/workflows/live-session.yml"
          encoded_path = urllib.parse.quote(path, safe="/")
          encoded_branch = urllib.parse.quote(branch, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/contents/{encoded_path}?ref={encoded_branch}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              source = json.load(response)
          text = base64.b64decode(source["content"]).decode("utf-8")

          summary = '''      - name: Show restored state summary
                if: __PERSIST__
                run: |
                  if [ -f data/shared_state.sqlite ]; then
                      echo "✓ Restored data/shared_state.sqlite ($(du -h data/shared_state.sqlite | cut -f1))"
                  fi
                  restored_sources=$(find munin/generated -type f 2>/dev/null | wc -l)
                  echo "✓ Restored ${restored_sources} generated source file(s)"

          '''.replace("__PERSIST__", expression("inputs.persist_state"))
          if text.count(summary) != 1:
              raise SystemExit(f"expected one summary block, found {text.count(summary)}")
          text = text.replace(summary, "", 1)

          restore = '''      - name: Restore Munin durable files from last session
                if: __PERSIST__
                id: state_restore
                continue-on-error: true
                env:
                  GH_TOKEN: __TOKEN__
                  MUNIN_RESTORE_ALLOWED_ACTORS: __ACTORS__
                run: |
                  python3 scripts/restore_munin_artifact.py \\
                    --workflow live-session.yml \\
                    --artifact munin-state \\
                    --branch "$GITHUB_REF_NAME" \\
                    --allowed-actor "$MUNIN_RESTORE_ALLOWED_ACTORS" \\
                    --destination "$GITHUB_WORKSPACE"

          '''
          restore = restore.replace("__PERSIST__", expression("inputs.persist_state"))
          restore = restore.replace("__TOKEN__", expression("github.token"))
          restore = restore.replace(
              "__ACTORS__",
              expression("vars.MUNIN_RESTORE_ALLOWED_ACTORS || github.repository_owner"),
          )
          restore += summary

          marker = "          poetry --version\n\n      - name: Verify offensive toolchain is present\n"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one insertion marker, found {text.count(marker)}")
          text = text.replace(
              marker,
              "          poetry --version\n\n" + restore + "      - name: Verify offensive toolchain is present\n",
              1,
          )
          if "dawidd6/action-download-artifact" in text:
              raise SystemExit("dawidd6 reference remains")
          if text.count("scripts/restore_munin_artifact.py") != 1:
              raise SystemExit("first-party restore step was not inserted exactly once")
          if token in text:
              raise SystemExit("token material appeared in generated workflow")

          body = json.dumps({"content": text, "encoding": "utf-8"}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/blobs",
              data=body,
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          print(f"LIVE_SESSION_BLOB_SHA={blob['sha']}")
          PY
