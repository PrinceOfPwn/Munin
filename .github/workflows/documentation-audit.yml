name: Munin Documentation Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Scan the complete repository or one commit range
        type: choice
        required: true
        default: full
        options: [full, changed]
      base_sha:
        description: Optional base SHA for a changed scan
        required: false
        type: string
      max_files:
        description: Optional file limit; zero means unlimited
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  # Kept for compatibility with the retired GitHub Models inference endpoint.
  # The runtime probes once and falls back locally when the service is unavailable.
  models: read

concurrency:
  group: documentation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Agentic complete-file review
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout analyzed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate deterministic code
        run: |
          python -m compileall -q munin tests scripts
          python -m py_compile \
            scripts/documentation_audit.py \
            scripts/documentation_audit_agentic.py \
            tests/test_documentation_audit.py \
            tests/test_documentation_audit_agentic.py
          git diff --check

      - name: Cache pinned Qwen model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: qwen3-5-4b-q4-k-m-ba06320255db

      - name: Cache native llama-cpp-python wheel
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama-wheelhouse
          key: llama-cpp-python-0.3.34-${{ runner.os }}-${{ runner.arch }}-py311-openblas-v1

      - name: Restore successful baseline marker
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/munin-documentation-baseline
          key: munin-documentation-baseline-v2-agentic

      - name: Install agent graph and native CPU inference runtime
        env:
          LLAMA_WHEELHOUSE: ${{ runner.temp }}/llama-wheelhouse
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev
          python -m pip install --upgrade pip
          python -m pip install \
            "huggingface-hub>=0.34,<2" \
            "langgraph>=1.2.10,<2"

          mkdir -p "$LLAMA_WHEELHOUSE"
          if ! compgen -G "$LLAMA_WHEELHOUSE/llama_cpp_python-0.3.34-*.whl" > /dev/null; then
            CMAKE_ARGS="-DGGML_NATIVE=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS" \
            CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" \
              python -m pip wheel \
                --no-deps \
                --no-binary=llama-cpp-python \
                --wheel-dir "$LLAMA_WHEELHOUSE" \
                "llama-cpp-python==0.3.34"
          fi
          python -m pip install "$LLAMA_WHEELHOUSE"/llama_cpp_python-0.3.34-*.whl

          python - <<'PY'
          import huggingface_hub
          import langgraph
          import llama_cpp
          print("huggingface_hub", huggingface_hub.__version__)
          print("langgraph", getattr(langgraph, "__version__", "installed"))
          print("llama_cpp", llama_cpp.__version__)
          print(llama_cpp.llama_print_system_info().decode("utf-8", errors="replace"))
          PY

      - name: Resolve audit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_BASE: ${{ inputs.base_sha }}
          INPUT_MAX_FILES: ${{ inputs.max_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE_HIT: ${{ steps.baseline.outputs.cache-hit }}
        run: |
          set -euo pipefail
          scope=changed
          base=""
          head="$PUSH_HEAD"
          max_files=0
          pr_number=""

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              pr_number="$PR_NUMBER"
              ;;
            push)
              base="$PUSH_BASE"
              if [ "$BASELINE_HIT" != "true" ]; then
                scope=full
                base=""
              fi
              ;;
            workflow_dispatch)
              scope="${INPUT_SCOPE:-full}"
              base="${INPUT_BASE:-}"
              max_files="${INPUT_MAX_FILES:-0}"
              ;;
          esac

          {
            echo "scope=$scope"
            echo "base=$base"
            echo "head=$head"
            echo "max_files=$max_files"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Analyze selected files with bounded context
        env:
          # Never expose the repository token to pull-request code. A compatibility
          # probe is allowed only for trusted push/manual runs.
          GITHUB_MODELS_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
          SCOPE: ${{ steps.range.outputs.scope }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          MAX_FILES: ${{ steps.range.outputs.max_files }}
          PR_NUMBER: ${{ steps.range.outputs.pr_number }}
          AUDIT_OUTPUT: ${{ github.workspace }}/.audit-output
          MODEL_CACHE: ${{ runner.temp }}/hf-cache
        run: |
          set -euo pipefail
          args=(
            --config .munin-doc-audit.toml
            --scope "$SCOPE"
            --head "$HEAD_SHA"
            --output-dir "$AUDIT_OUTPUT"
            --model-cache "$MODEL_CACHE"
            --max-files "$MAX_FILES"
          )
          [ -z "$BASE_SHA" ] || args+=(--base "$BASE_SHA")
          [ -z "$PR_NUMBER" ] || args+=(--pr-number "$PR_NUMBER")
          python scripts/documentation_audit_agentic.py "${args[@]}"

      - name: Prove tracked files are unchanged
        run: git diff --exit-code -- .

      - name: Create successful baseline marker
        if: ${{ success() && github.event_name == 'push' && steps.baseline.outputs.cache-hit != 'true' }}
        env:
          BASELINE_DIR: ${{ runner.temp }}/munin-documentation-baseline
        run: |
          mkdir -p "$BASELINE_DIR"
          printf '%s\n' "${{ github.sha }}" > "$BASELINE_DIR/completed"

      - name: Save successful baseline marker
        if: ${{ success() && github.event_name == 'push' && steps.baseline.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/munin-documentation-baseline
          key: munin-documentation-baseline-v2-agentic

      - name: Publish job summary
        if: always()
        env:
          AUDIT_OUTPUT: ${{ github.workspace }}/.audit-output
        run: |
          if [ -f "$AUDIT_OUTPUT/summary.md" ]; then
            cat "$AUDIT_OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              "# Munin documentation audit" \
              "The audit failed before producing a report." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload structured reports and bilingual PR text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munin-documentation-audit
          path: ${{ github.workspace }}/.audit-output/
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
