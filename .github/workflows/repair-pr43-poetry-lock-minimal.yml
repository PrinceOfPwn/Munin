name: Repair PR43 Poetry Lock Minimally

on:
  push:
    branches:
      - raven-mind/integrate-valravn
    paths:
      - .github/workflows/repair-pr43-poetry-lock-minimal.yml

permissions:
  contents: write

jobs:
  repair-lock-minimally:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pre-repair lock and remove merge corruption
        run: |
          git show c8520aa77e39bc2e320b39172369b785fd5b1f46:poetry.lock > poetry.lock
          python - <<'PY'
          from pathlib import Path
          p = Path('poetry.lock')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          seen = False
          for line in lines:
              if line.startswith('content-hash = '):
                  if seen:
                      continue
                  seen = True
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Re-lock without regenerating unrelated packages
        run: |
          python -m pip install --upgrade pip
          pip install 'poetry==2.4.1'
          poetry lock
          poetry check --lock
          poetry install --no-interaction --no-root
      - name: Commit minimal repaired lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock
          git commit -m 'fix(ci): repair poetry lock without dependency churn'
          git push origin HEAD:raven-mind/integrate-valravn
