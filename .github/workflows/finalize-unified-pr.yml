name: Finalize unified PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finalize-unified-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/unified-system-issue-18'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout unified branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-system-issue-18
          fetch-depth: 0

      - name: Reconcile post-fork runtime methods and review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop

          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          STORE = Path("munin/production/store.py")
          ORCH = Path("munin/core/orchestrator.py")

          def git_show(spec: str) -> str:
              return subprocess.check_output(["git", "show", spec], text=True)

          def class_methods(source: str, class_name: str):
              tree = ast.parse(source)
              cls = next(
                  node for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == class_name
              )
              methods = {
                  node.name: node
                  for node in cls.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }
              return tree, cls, methods

          def semantic(node: ast.AST) -> str:
              return ast.dump(node, include_attributes=False)

          def transplant_main_only_methods(path: Path, class_names: tuple[str, ...]) -> None:
              merge_base = subprocess.check_output(
                  ["git", "merge-base", "origin/develop", "origin/main"], text=True
              ).strip()
              base = git_show(f"{merge_base}:{path.as_posix()}")
              main = git_show(f"origin/main:{path.as_posix()}")
              current = path.read_text(encoding="utf-8")

              for class_name in class_names:
                  _, _, base_methods = class_methods(base, class_name)
                  _, _, main_methods = class_methods(main, class_name)
                  _, _, cur_methods = class_methods(current, class_name)
                  main_lines = main.splitlines()
                  cur_lines = current.splitlines()
                  replacements: list[tuple[int, int, list[str], str]] = []
                  additions: list[tuple[str, list[str]]] = []

                  for name, main_node in main_methods.items():
                      base_node = base_methods.get(name)
                      cur_node = cur_methods.get(name)
                      if base_node is None:
                          if cur_node is None:
                              additions.append(
                                  (name, main_lines[main_node.lineno - 1 : main_node.end_lineno])
                              )
                          continue
                      if semantic(main_node) == semantic(base_node):
                          continue
                      if cur_node is not None and semantic(cur_node) == semantic(base_node):
                          replacements.append(
                              (
                                  cur_node.lineno - 1,
                                  cur_node.end_lineno,
                                  main_lines[main_node.lineno - 1 : main_node.end_lineno],
                                  name,
                              )
                          )
                      elif cur_node is not None and semantic(cur_node) != semantic(main_node):
                          print(f"overlap preserved for {class_name}.{name}")

                  for start, end, replacement, name in sorted(replacements, reverse=True):
                      print(f"replaying main-only change: {class_name}.{name}")
                      cur_lines[start:end] = replacement
                  current = "\n".join(cur_lines) + "\n"

                  if additions:
                      _, cur_cls, _ = class_methods(current, class_name)
                      cur_lines = current.splitlines()
                      insert_at = cur_cls.end_lineno
                      block: list[str] = []
                      for name, method_lines in additions:
                          print(f"replaying main-only addition: {class_name}.{name}")
                          block.extend(["", *method_lines])
                      cur_lines[insert_at:insert_at] = block
                      current = "\n".join(cur_lines) + "\n"

              path.write_text(current, encoding="utf-8")

          # Preserve every post-fork store method that main added, and replay a
          # changed main method only when develop left the merge-base version
          # untouched.  If both branches changed the same method we keep the
          # Issue #18 implementation and rely on explicit tests instead of
          # silently overwriting it.
          transplant_main_only_methods(STORE, ("ProductionStore", "MuninStore"))

          source = STORE.read_text(encoding="utf-8")
          replacements = {
              '"""CREATE INDEX IF NOT EXISTS idx_tool_calls_run ON tool_calls(run_id)""",':
                  '"""CREATE INDEX IF NOT EXISTS idx_tool_calls_run_started ON tool_calls(run_id, started_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_reasoning_events_run ON reasoning_events(run_id)""",':
                  '"""CREATE INDEX IF NOT EXISTS idx_reasoning_events_run_created ON reasoning_events(run_id, created_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_human_requests_run ON human_requests(run_id)""",':
                  '"""CREATE INDEX IF NOT EXISTS idx_human_requests_run_created ON human_requests(run_id, created_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_subagent_runs_parent ON subagent_runs(parent_run_id)""",':
                  '"""CREATE INDEX IF NOT EXISTS idx_subagent_runs_parent_started ON subagent_runs(parent_run_id, started_at_ms, id)""",',
              '"""CREATE INDEX IF NOT EXISTS idx_conversation_artifacts_run ON conversation_artifacts(run_id)""",':
                  '"""CREATE INDEX IF NOT EXISTS idx_conversation_artifacts_run_created ON conversation_artifacts(run_id, created_at_ms, id)""",',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one index declaration {old!r}, found {count}")
              source = source.replace(old, new)
          summaries_conv = '"""CREATE INDEX IF NOT EXISTS idx_conversation_summaries_conv ON conversation_summaries(conversation_id)""",'
          summaries_run = '"""CREATE INDEX IF NOT EXISTS idx_conversation_summaries_run_created ON conversation_summaries(run_id, created_at_ms, id)""",'
          if summaries_run not in source:
              if source.count(summaries_conv) != 1:
                  raise SystemExit("conversation summary index anchor changed")
              source = source.replace(summaries_conv, summaries_conv + "\n    " + summaries_run)
          STORE.write_text(source, encoding="utf-8")

          # supervisor_v2 has no subprocess runner.  The queue insert is the
          # authoritative operation; presence is observability only.  Never
          # claim a legacy SPAWNING slot, and never tell callers to retry a
          # task that was already enqueued just because the presence write
          # failed afterward.
          orch_source = ORCH.read_text(encoding="utf-8")
          tree, cls, methods = class_methods(orch_source, "Orchestrator")
          wake = methods["wake"]
          lines = orch_source.splitlines()
          new_wake = '''    def wake(
        self,
        subagent_name: str,
        task: dict[str, Any],
        *,
        priority: int = 0,
        detached: bool = True,
    ) -> dict[str, Any]:
        """Queue one supervisor_v2 wake without claiming a legacy spawn slot.

        The queue insert is authoritative: once ``enqueue_wake`` returns a
        ``wake_id`` the task exists and callers must not retry it merely because
        the best-effort presence refresh failed.  supervisor_v2 has no
        ``munin.subagents.runner`` child process, so claiming ``SPAWNING`` would
        create a lease that nothing can legitimately consume or clear.
        """
        del detached  # retained for API compatibility with the legacy caller
        normalized_name = subagent_name.strip()
        wake_id = self.state.enqueue_wake(
            target_agent=normalized_name,
            task=task,
            priority=priority,
        )
        result: dict[str, Any] = {
            "wake_id": wake_id,
            "target_agent": normalized_name,
            "pid": None,
            "spawned": False,
            "queued": True,
            "presence_updated": True,
            "reason": "supervisor_v2_wake_path",
        }
        try:
            self.state.upsert_presence(
                agent_name=normalized_name,
                role="",
                status="IDLE",
                current_task_id=None,
                metadata_json=json.dumps(presence_metadata(os.getpid(), lease_seconds=0)),
            )
        except Exception as exc:  # noqa: BLE001 - queue success must be preserved
            logger.warning(
                "wake %s queued as %s but presence refresh failed: %s",
                normalized_name,
                wake_id,
                exc,
            )
            result["presence_updated"] = False
            result["warning"] = {
                "code": "presence_update_failed",
                "message": str(exc),
            }
        return result'''.splitlines()
          lines[wake.lineno - 1 : wake.end_lineno] = new_wake
          orch_source = "\n".join(lines) + "\n"
          orch_source = orch_source.replace(
              "- Immediately spawn a subprocess `python -m munin.subagents.runner <name>`; the\n"
              "  subprocess claims the wake item and executes it, publishing progress via\n"
              "  `shared_intel` / `agent_messages` and finishing with `complete_shared_task`.\n"
              "- Sleep is implicit: the subprocess ends when the wake queue is empty for that agent\n"
              "  and after `sleep_after_idle_seconds` of inactivity.\n",
              "- supervisor_v2 does not spawn `munin.subagents.runner`; a connected supervisor\n"
              "  observes and claims durable wake rows. Presence updates are best-effort metadata.\n"
              "- Sleep marks presence IDLE; queued work remains durable until a supervisor claims it.\n",
          )
          ORCH.write_text(orch_source, encoding="utf-8")
          PY

          git diff --check
          python -m py_compile munin/production/store.py munin/core/orchestrator.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction

      - name: Validate review fixes and merged runtime
        shell: bash
        run: |
          set -euo pipefail
          poetry run ruff check --select F munin tests
          poetry run pytest -q \
            tests/test_store_indexes.py \
            tests/test_orchestrator_wake_semantics.py \
            tests/test_pr_review_regressions.py \
            tests/test_run_cancel.py \
            tests/test_cancel_sse_events.py \
            tests/test_guidance_lifecycle.py \
            tests/test_guidance_lifecycle_e2e.py \
            tests/test_artifacts_store.py \
            tests/test_artifacts_endpoints.py \
            tests/test_asgi_artifacts.py \
            tests/test_run_detail_endpoint.py \
            tests/test_sandboxed_html_registry.py \
            tests/test_sse_workflow_events.py \
            tests/test_discord_adapter.py \
            tests/test_discord_regression.py \
            tests/test_chat_recovery.py \
            tests/test_compaction.py

      - name: Publish reconciled runtime and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add munin/production/store.py munin/core/orchestrator.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(runtime): reconcile post-fork store and wake semantics"
          fi
          git rm .github/workflows/finalize-unified-pr.yml
          git commit -m "chore: remove unified PR finalizer"
          git push origin HEAD:agent/unified-system-issue-18
