name: CI

on:
  push:
    branches: [main, master, "raven-mind/**", "codex/**"]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install project (with dev deps)
        run: poetry install --no-interaction --no-root

      - name: Ruff (lint)
        run: poetry run ruff check munin tests

      - name: Pytest — characterization + unit
        env:
          MUNIN_TEST_MODE: "1"
        run: poetry run pytest tests/ -x --tb=short

  frontend:
    name: Frontend — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./app/package-lock.json

      - name: Install (npm)
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test -- --run

      - name: Next build (smoke)
        run: npm run build
        env:
          NEXT_PUBLIC_MUNIN_MCP_URL: "http://localhost:8000"

  deletion-locks:
    name: Deletion locks (legacy code guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install pytest

      - name: Run legacy-deletion tests
        run: |
          pytest tests/characterization/test_legacy_orchestration_deleted.py \
                 tests/characterization/test_no_respond_call_sites.py \
                 tests/characterization/test_munin_wake_shim.py \
                 -v --tb=short
