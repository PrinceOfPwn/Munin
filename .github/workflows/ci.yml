name: Munin CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + Turso online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip poetry==2.3.2
          poetry install --no-interaction --no-ansi --sync
      - name: Compile
        run: |
          poetry run python -m compileall -q munin tests scripts
          bash -n scripts/open_tunnel.sh
      - name: Static analysis
        # Start with fatal Python diagnostics. The repository has a separate
        # style-debt backlog; this gate must be green before it can ratchet
        # beyond import/name/undefined-variable failures.
        run: poetry run ruff check --select F munin tests scripts
      - name: Unit and regression tests
        env:
          MUNIN_DB_URL: ""
          MUNIN_DB_AUTH_TOKEN: ""
        run: poetry run python -m pytest -q
      - name: Turso online roundtrip
        if: ${{ env.MUNIN_DB_URL != '' && env.MUNIN_DB_AUTH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: poetry run python scripts/turso_smoke.py
      - name: Janitor expired Production Suite test namespaces
        if: always()
        run: |
          if [ -n "$MUNIN_DB_URL" ] && [ -n "$MUNIN_MASTER_KEY" ]; then
            poetry run python scripts/production_fixture_janitor.py --janitor
          fi

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e_lab:
    name: Actions E2E lab (Turso + LDAP + Apache)
    # Never expose repository secrets to a workflow originating from a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "AKATSUKI"
          LDAP_DOMAIN: "akatsuki.com"
          LDAP_BASE_DN: "dc=akatsuki,dc=com"
          LDAP_ADMIN_PASSWORD: "itachi"
          LDAP_CONFIG_PASSWORD: "itachi"
          LDAP_TLS: "false"
        ports:
          - 389:389
      apache:
        # Intentionally isolated fixture for service-version detection only.
        image: httpd:2.4.49
        ports:
          - 80:80
    env:
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      # Use only for the isolated e2e_<run-id> fixture namespace. Production
      # deployments must provide their own key via the secret store.
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY || '000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f' }}
      MUNIN_E2E_TEST_RUN_ID: e2e_${{ github.run_id }}_deadbeef
      MUNIN_MCP_AUTH_TOKEN: actions-e2e-lab-token
      LDAP_URI: ldap://127.0.0.1:389
      LDAP_BASE_DN: dc=akatsuki,dc=com
      LDAP_BIND_DN: cn=admin,dc=akatsuki,dc=com
      LDAP_PASSWORD: itachi
      PREFLIGHT_POLICY: off
      MUNIN_SMOKE_LDAP_TARGET: 127.0.0.1
      MUNIN_SMOKE_APACHE_TARGET: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Munin and lab probes
        run: |
          python -m pip install --upgrade pip poetry==2.3.2
          poetry install --no-interaction --no-ansi --only main --sync
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ldap-utils nmap
          GOBIN="$HOME/go/bin" go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.10
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # Pin the process to the binary we just installed; runner images can
          # carry unrelated httpx/pd-httpx commands on PATH.
          echo "MUNIN_HTTPX_BINARY=$HOME/go/bin/httpx" >> "$GITHUB_ENV"
      - name: Require online Turso configuration
        run: |
          test -n "$MUNIN_DB_URL"
          test -n "$MUNIN_DB_AUTH_TOKEN"
          case "$MUNIN_DB_URL" in libsql://*|libsqls://*) ;; *) exit 1 ;; esac
      - name: Verify Turso online persistence
        run: poetry run python scripts/turso_smoke.py
      - name: Wait for and seed LDAP + Apache lab
        run: |
          for i in $(seq 1 30); do
            if ldapsearch -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -b "$LDAP_BASE_DN" "(objectClass=*)" dn 2>/dev/null | grep -q "result: 0"; then
              break
            fi
            test "$i" -lt 30 || { echo "LDAP did not become ready" >&2; exit 1; }
            sleep 1
          done
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_mock.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_seed/60-web-lab.ldif
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:80/ >/dev/null
      - name: Start unified Munin server
        # Fase 3 (issue #9): the pre-migration two-process launch (``munin mcp``
        # on :8890 + ``munin production-api`` on :8787) is gone.  ``munin serve``
        # boots the composed Starlette app that mounts the HTTP API at ``/`` and
        # the FastMCP streamable-http transport at ``/mcp``, both on :8787.
        env:
          MUNIN_ALLOWED_ORIGINS: http://127.0.0.1:3000
          MUNIN_COOKIE_SECURE: "0"
        run: |
          nohup env PYTHONUNBUFFERED=1 poetry run munin serve --host 127.0.0.1 --port 8787 \
            </dev/null > /tmp/munin-e2e.log 2>&1 &
          echo $! > /tmp/munin-e2e.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/munin-e2e.log
          exit 1
      - name: Exercise MCP against online lab services
        run: MUNIN_SMOKE_BASE_URL=http://127.0.0.1:8787 poetry run python scripts/ci_live_smoke.py --require-turso
      - name: Build and start the production GUI
        working-directory: app
        env:
          NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN: "1"
          MUNIN_PRODUCTION_API_URL: "http://127.0.0.1:8787"
        run: |
          npm ci --no-audit
          npm run build
          nohup env NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN=1 \
            MUNIN_PRODUCTION_API_URL=http://127.0.0.1:8787 \
            npm run start -- --hostname 127.0.0.1 --port 3000 \
            </dev/null > /tmp/munin-gui-e2e.log 2>&1 &
          echo $! > /tmp/munin-gui-e2e.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/munin-gui-e2e.log
          exit 1
      - name: Verify same-origin GUI MCP proxy
        run: MUNIN_SMOKE_BASE_URL=http://127.0.0.1:3000 poetry run python scripts/ci_live_smoke.py --proxy-only --require-turso
      - name: Cleanup exact Production Suite test namespace
        if: always()
        run: |
          if [ -n "$MUNIN_DB_URL" ] && [ -n "$MUNIN_MASTER_KEY" ]; then
            poetry run python scripts/production_fixture_janitor.py --test-run-id "$MUNIN_E2E_TEST_RUN_ID"
          fi
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-e2e-lab-${{ github.run_id }}
          path: |
            /tmp/munin-e2e.log
            /tmp/munin-gui-e2e.log
          retention-days: 7

  live-llm-smoke:
    name: Post-merge live LLM ReAct canary (1 real turn)
    # Same fork-safety gate as e2e_lab: never expose LLM_* secrets to PRs from forks.
    # Real providers are inherently non-deterministic and must never decide
    # whether a PR is mergeable. This canary runs after a main push or when an
    # operator explicitly dispatches the CI workflow.
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "AKATSUKI"
          LDAP_DOMAIN: "akatsuki.com"
          LDAP_BASE_DN: "dc=akatsuki,dc=com"
          LDAP_ADMIN_PASSWORD: "itachi"
          LDAP_CONFIG_PASSWORD: "itachi"
          LDAP_TLS: "false"
        ports:
          - 389:389
      apache:
        image: httpd:2.4.49
        ports:
          - 80:80
    env:
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY || '000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f' }}
      MUNIN_E2E_TEST_RUN_ID: e2e_${{ github.run_id }}_deadbeef
      MUNIN_MCP_AUTH_TOKEN: actions-e2e-lab-token
      # Real LLM provider credentials — these drive MuninAgent.respond.
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LDAP_URI: ldap://127.0.0.1:389
      LDAP_BASE_DN: dc=akatsuki,dc=com
      LDAP_BIND_DN: cn=admin,dc=akatsuki,dc=com
      LDAP_PASSWORD: itachi
      PREFLIGHT_POLICY: off
      MUNIN_SMOKE_LDAP_TARGET: 127.0.0.1
      MUNIN_SMOKE_APACHE_TARGET: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Munin and lab probes
        run: |
          python -m pip install --upgrade pip poetry==2.3.2
          poetry install --no-interaction --no-ansi --only main --sync
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ldap-utils nmap
          GOBIN="$HOME/go/bin" go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.10
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "MUNIN_HTTPX_BINARY=$HOME/go/bin/httpx" >> "$GITHUB_ENV"
      - name: Require online Turso + LLM configuration
        run: |
          test -n "$MUNIN_DB_URL"
          test -n "$MUNIN_DB_AUTH_TOKEN"
          test -n "$LLM_BASE_URL"
          test -n "$LLM_API_KEY"
          test -n "$LLM_MODEL"
          case "$MUNIN_DB_URL" in libsql://*|libsqls://*) ;; *) exit 1 ;; esac
      - name: Verify Turso online persistence
        run: poetry run python scripts/turso_smoke.py
      - name: Wait for and seed LDAP + Apache lab
        run: |
          for i in $(seq 1 30); do
            if ldapsearch -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -b "$LDAP_BASE_DN" "(objectClass=*)" dn 2>/dev/null | grep -q "result: 0"; then
              break
            fi
            test "$i" -lt 30 || { echo "LDAP did not become ready" >&2; exit 1; }
            sleep 1
          done
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_mock.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_seed/60-web-lab.ldif
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:80/ >/dev/null
      - name: Create per-run live-LLM smoke user
        # ``bootstrap_admin`` is global-once on the shared Turso, so the smoke
        # logs in as a dedicated fixture user created through the store, and
        # the janitor removes it again in the cleanup step below.
        run: |
          poetry run python - <<'PY'
          import os
          import secrets

          from munin.mcp.config import get_settings
          from munin.production.store import ProductionStore

          settings = get_settings()
          store = ProductionStore.for_settings(settings, master_key=ProductionStore.master_key_from_environment())
          username = f"llm_smoke_{os.environ['MUNIN_E2E_TEST_RUN_ID']}"
          password = secrets.token_urlsafe(24)
          store.create_user(username=username, password=password, role="operator")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"MUNIN_LIVE_SMOKE_ADMIN={username}\n")
              fh.write(f"MUNIN_LIVE_SMOKE_PASSWORD={password}\n")
          print(f"created live-LLM smoke user {username}")
          PY
      - name: Start unified Munin server
        # Fase 3 (issue #9): one process serves both the HTTP API (/) and the
        # FastMCP transport (/mcp) on :8787 — the pre-migration two-process
        # launch is gone.
        env:
          MUNIN_ALLOWED_ORIGINS: http://127.0.0.1:8787
          MUNIN_COOKIE_SECURE: "0"
        run: |
          nohup env PYTHONUNBUFFERED=1 poetry run munin serve --host 127.0.0.1 --port 8787 \
            </dev/null > /tmp/munin-e2e.log 2>&1 &
          echo $! > /tmp/munin-e2e.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/munin-e2e.log
          exit 1
      - name: Exercise MCP against lab services (catalog sanity)
        run: MUNIN_SMOKE_BASE_URL=http://127.0.0.1:8787 poetry run python scripts/ci_live_smoke.py --require-turso
      - name: Live LLM ReAct smoke (1 turn, retry on provider transient)
        env:
          MUNIN_LIVE_SMOKE_ORIGIN: http://127.0.0.1:8787
        run: poetry run python scripts/live_llm_smoke.py
      - name: Cleanup exact Production Suite test namespace
        if: always()
        run: |
          if [ -n "$MUNIN_DB_URL" ] && [ -n "$MUNIN_MASTER_KEY" ]; then
            poetry run python scripts/production_fixture_janitor.py --test-run-id "$MUNIN_E2E_TEST_RUN_ID" --fixture-user "$MUNIN_LIVE_SMOKE_ADMIN"
          fi
      - name: Upload live-LLM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-llm-smoke-${{ github.run_id }}
          path: |
            /tmp/munin-e2e.log
          retention-days: 7
