name: Munin CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend + Turso online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio pytest-cov respx ruff
      - name: Compile
        run: |
          python -m compileall -q munin tests scripts
          bash -n scripts/open_tunnel.sh
      - name: Unit and regression tests
        env:
          MUNIN_DB_URL: ""
          MUNIN_DB_AUTH_TOKEN: ""
        run: python -m pytest -q
      - name: Turso online roundtrip
        if: ${{ env.MUNIN_DB_URL != '' && env.MUNIN_DB_AUTH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: python scripts/turso_smoke.py
      - name: Janitor expired Production Suite test namespaces
        if: always()
        run: |
          if [ -n "$MUNIN_DB_URL" ] && [ -n "$MUNIN_MASTER_KEY" ]; then
            python scripts/production_fixture_janitor.py --janitor
          fi

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit
      - run: npm run build

  e2e_lab:
    name: Actions E2E lab (Turso + LDAP + Apache)
    # Never expose repository secrets to a workflow originating from a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "AKATSUKI"
          LDAP_DOMAIN: "akatsuki.com"
          LDAP_BASE_DN: "dc=akatsuki,dc=com"
          LDAP_ADMIN_PASSWORD: "itachi"
          LDAP_CONFIG_PASSWORD: "itachi"
          LDAP_TLS: "false"
        ports:
          - 389:389
      apache:
        # Intentionally isolated fixture for service-version detection only.
        image: httpd:2.4.49
        ports:
          - 80:80
    env:
      MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      MUNIN_MASTER_KEY: ${{ secrets.MUNIN_MASTER_KEY }}
      MUNIN_E2E_TEST_RUN_ID: e2e_${{ github.run_id }}_deadbeef
      MUNIN_MCP_AUTH_TOKEN: actions-e2e-lab-token
      LDAP_URI: ldap://127.0.0.1:389
      LDAP_BASE_DN: dc=akatsuki,dc=com
      LDAP_BIND_DN: cn=admin,dc=akatsuki,dc=com
      LDAP_PASSWORD: itachi
      PREFLIGHT_POLICY: off
      MUNIN_SMOKE_LDAP_TARGET: 127.0.0.1
      MUNIN_SMOKE_APACHE_TARGET: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Munin and lab probes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ldap-utils nmap
          GOBIN="$HOME/go/bin" go install github.com/projectdiscovery/httpx/cmd/httpx@v1.6.10
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Require online Turso configuration
        run: |
          test -n "$MUNIN_DB_URL"
          test -n "$MUNIN_DB_AUTH_TOKEN"
          case "$MUNIN_DB_URL" in libsql://*|libsqls://*) ;; *) exit 1 ;; esac
      - name: Verify Turso online persistence
        run: python scripts/turso_smoke.py
      - name: Wait for and seed LDAP + Apache lab
        run: |
          for i in $(seq 1 30); do
            if ldapsearch -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -b "$LDAP_BASE_DN" "(objectClass=*)" dn 2>/dev/null | grep -q "result: 0"; then
              break
            fi
            test "$i" -lt 30 || { echo "LDAP did not become ready" >&2; exit 1; }
            sleep 1
          done
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_mock.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" -f scripts/ldap_seed/60-web-lab.ldif
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:80/ >/dev/null
      - name: Start MCP server
        run: |
          # Use the installed entrypoint. Running main with `python -m` creates
          # a second module instance, while extension modules import the
          # canonical `munin.mcp.main` singleton to register their tools.
          nohup munin mcp --transport streamable-http --host 127.0.0.1 --port 8890 \
            </dev/null > /tmp/munin-e2e.log 2>&1 &
          echo $! > /tmp/munin-e2e.pid
      - name: Exercise MCP against online lab services
        run: python scripts/ci_live_smoke.py --require-turso
      - name: Start authenticated Production Suite API
        env:
          MUNIN_ALLOWED_ORIGINS: http://127.0.0.1:3000
          MUNIN_COOKIE_SECURE: "0"
          MUNIN_PRODUCTION_AUTO_DISPATCH: "0"
        run: |
          nohup munin production-api --host 127.0.0.1 --port 8787 \
            </dev/null > /tmp/munin-production-api.log 2>&1 &
          echo $! > /tmp/munin-production-api.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8787/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/munin-production-api.log
          exit 1
      - name: Build and start the production GUI
        working-directory: app
        env:
          NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN: "1"
        run: |
          npm ci --no-audit
          npm run build
          nohup env NEXT_PUBLIC_MUNIN_MCP_SAME_ORIGIN=1 npm run start -- --hostname 127.0.0.1 --port 3000 \
            </dev/null > /tmp/munin-gui-e2e.log 2>&1 &
          echo $! > /tmp/munin-gui-e2e.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/munin-gui-e2e.log
          exit 1
      - name: Verify same-origin GUI MCP proxy
        run: MUNIN_SMOKE_BASE_URL=http://127.0.0.1:3000 python scripts/ci_live_smoke.py --proxy-only --require-turso
      - name: Cleanup exact Production Suite test namespace
        if: always()
        run: |
          if [ -n "$MUNIN_DB_URL" ] && [ -n "$MUNIN_MASTER_KEY" ]; then
            python scripts/production_fixture_janitor.py --test-run-id "$MUNIN_E2E_TEST_RUN_ID"
          fi
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-e2e-lab-${{ github.run_id }}
          path: |
            /tmp/munin-e2e.log
            /tmp/munin-gui-e2e.log
            /tmp/munin-production-api.log
          retention-days: 7
