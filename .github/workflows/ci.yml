name: Munin CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend + Turso online
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio pytest-cov respx ruff
      - name: Compile
        run: python -m compileall -q munin tests scripts/turso_smoke.py
      - name: Unit and regression tests
        env:
          MUNIN_DB_URL: ""
          MUNIN_DB_AUTH_TOKEN: ""
        run: python -m pytest -q
      - name: Turso online roundtrip
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          MUNIN_DB_URL: ${{ secrets.MUNIN_DB_URL }}
          MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
        run: python scripts/turso_smoke.py

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit
      - run: npm run build
