name: Prepare exact workflow restoration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/live-command-output-stream'
    runs-on: ubuntu-latest
    steps:
      - name: Build live-session blob from original PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ORIGINAL_HEAD: 1205684b97b57f880a85a1ac773cfb41b9b15b1e
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          original_head = os.environ["ORIGINAL_HEAD"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "munin-workflow-restoration",
          }

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=body,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          path = ".github/workflows/live-session.yml"
          encoded_path = urllib.parse.quote(path, safe="/")
          source = request(
              "GET",
              f"/repos/{repository}/contents/{encoded_path}?ref={original_head}",
          )
          text = base64.b64decode(source["content"]).decode("utf-8")

          start = text.index("      # Turso persists registry rows, but generated Python/JSON sources still\n")
          end_marker = "          if_no_artifact_found: warn\n"
          end = text.index(end_marker, start) + len(end_marker)
          while end < len(text) and text[end] == "\n":
              end += 1
          text = text[:start] + text[end:]
          if "dawidd6/action-download-artifact" in text:
              raise SystemExit("dawidd6 reference remains")

          blob = request(
              "POST",
              f"/repos/{repository}/git/blobs",
              {"content": text, "encoding": "utf-8"},
          )
          print(f"RESTORED_LIVE_BLOB_SHA={blob['sha']}")
          PY
