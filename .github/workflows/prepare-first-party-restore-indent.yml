name: Prepare restore indentation fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/live-command-output-stream'
    runs-on: ubuntu-latest
    steps:
      - name: Build corrected live-session blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "munin-workflow-indent-fix",
          }

          def expression(value):
              return "$" + "{{ " + value + " }}"

          path = ".github/workflows/live-session.yml"
          encoded_path = urllib.parse.quote(path, safe="/")
          encoded_branch = urllib.parse.quote(branch, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/contents/{encoded_path}?ref={encoded_branch}",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              source = json.load(response)
          text = base64.b64decode(source["content"]).decode("utf-8")

          start_marker = "      - name: Restore Munin durable files from last session\n"
          end_marker = "      - name: Show restored state summary\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          lines = [
              "      - name: Restore Munin durable files from last session",
              "        if: " + expression("inputs.persist_state"),
              "        id: state_restore",
              "        continue-on-error: true",
              "        env:",
              "          GH_TOKEN: " + expression("github.token"),
              "          MUNIN_RESTORE_ALLOWED_ACTORS: "
              + expression("vars.MUNIN_RESTORE_ALLOWED_ACTORS || github.repository_owner"),
              "        run: |",
              "          python3 scripts/restore_munin_artifact.py \\",
              "            --workflow live-session.yml \\",
              "            --artifact munin-state \\",
              "            --branch \"$GITHUB_REF_NAME\" \\",
              "            --allowed-actor \"$MUNIN_RESTORE_ALLOWED_ACTORS\" \\",
              "            --destination \"$GITHUB_WORKSPACE\"",
              "",
          ]
          replacement = "\n".join(lines) + "\n"
          text = text[:start] + replacement + text[end:]
          if token in text:
              raise SystemExit("token material appeared in generated workflow")
          if text.count("scripts/restore_munin_artifact.py") != 1:
              raise SystemExit("restore helper invocation count is not one")

          body = json.dumps({"content": text, "encoding": "utf-8"}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/blobs",
              data=body,
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          print(f"LIVE_SESSION_BLOB_SHA={blob['sha']}")
          PY
