name: One-shot unify open PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-shot-unify-prs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'agent/unified-system-issue-18'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the real head branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-system-issue-18
          fetch-depth: 0

      - name: Materialize the unified history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop fix/register-documentation-audit agent/valravn-burp-ultimate

          # Remove the temporary conflict experiment before doing a real merge.
          if [ -f .gitattributes ] && grep -q 'merge=union' .gitattributes; then
            git rm .gitattributes
            git commit -m "chore: remove temporary merge policy"
          fi

          # The branch already starts at PR #72. Merge the complete Issue #32
          # stack. Six files also evolved on main after the stack forked; keep
          # the modern side for those conflicts and let every other hunk merge.
          set +e
          git merge --no-ff --no-commit origin/develop
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Issue #32 conflicts:\n%s\n' "${conflicts[*]}"
            allowed=(
              changes.md
              munin/mcp/main.py
              munin/mcp/tools/munin_tools.py
              munin/production/chat.py
              munin/production/store.py
              munin/subagents/base.py
            )
            for path in "${conflicts[@]}"; do
              ok=0
              for expected in "${allowed[@]}"; do
                if [ "$path" = "$expected" ]; then ok=1; break; fi
              done
              if [ "$ok" -ne 1 ]; then
                echo "Unexpected conflict: $path" >&2
                exit 1
              fi
              git checkout --ours -- "$path"
              git add "$path"
            done
          fi
          git commit -m "merge(frontend): consolidate Issue #18/#32 implementation"

          # Independent documentation-audit performance/artifact fix (#42).
          git merge --no-ff --no-edit origin/fix/register-documentation-audit
          test -z "$(git ls-files -u)"
          git diff --check origin/main...HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install backend
        shell: bash
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction

      - name: Validate Issue #18 runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          poetry run ruff check --select F munin tests
          poetry run pytest -q \
            tests/test_run_cancel.py \
            tests/test_cancel_sse_events.py \
            tests/test_guidance_lifecycle.py \
            tests/test_guidance_lifecycle_e2e.py \
            tests/test_artifacts_store.py \
            tests/test_artifacts_endpoints.py \
            tests/test_asgi_artifacts.py \
            tests/test_run_detail_endpoint.py \
            tests/test_sandboxed_html_registry.py \
            tests/test_sse_workflow_events.py \
            tests/test_store_indexes.py \
            tests/test_discord_adapter.py \
            tests/test_compaction.py

      - name: Validate frontend
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run lint
          npm test -- --run

      - name: Publish the consolidated branch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-unify-prs.yml
          git commit -m "chore: remove one-shot consolidation workflow"
          git push origin HEAD:agent/unified-system-issue-18
