name: One-shot unify open PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-shot-unify-prs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'agent/unified-system-issue-18'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the real head branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-system-issue-18
          fetch-depth: 0

      - name: Materialize the unified history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop fix/register-documentation-audit agent/valravn-burp-ultimate

          if [ -f .gitattributes ] && grep -q 'merge=union' .gitattributes; then
            git rm .gitattributes
            git commit -m "chore: remove temporary merge policy"
          fi

          # Keep a file-scoped patch containing everything that landed on main
          # after the Issue #32 stack forked.  store.py and chat.py need the
          # complete Issue #18 contracts from develop, but they also received
          # later Discord/guidance/compaction fixes on main.  Replaying these
          # patches after taking develop gives us both histories instead of
          # choosing one side wholesale.
          merge_base="$(git merge-base origin/develop origin/main)"
          git diff --binary "$merge_base"..origin/main -- munin/production/store.py > /tmp/main-store.patch
          git diff --binary "$merge_base"..origin/main -- munin/production/chat.py > /tmp/main-chat.patch

          set +e
          git merge --no-ff --no-commit origin/develop
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Issue #32 conflicts:\n%s\n' "${conflicts[*]}"
            allowed=(
              changes.md
              munin/mcp/main.py
              munin/mcp/tools/munin_tools.py
              munin/production/chat.py
              munin/production/store.py
              munin/subagents/base.py
            )
            for path in "${conflicts[@]}"; do
              ok=0
              for expected in "${allowed[@]}"; do
                if [ "$path" = "$expected" ]; then ok=1; break; fi
              done
              if [ "$ok" -ne 1 ]; then
                echo "Unexpected conflict: $path" >&2
                exit 1
              fi

              case "$path" in
                munin/production/store.py|munin/production/chat.py)
                  # These files carry most of the Issue #18 runtime contract.
                  git checkout --theirs -- "$path"
                  ;;
                *)
                  # Preserve newer main behavior for unrelated overlap.
                  git checkout --ours -- "$path"
                  ;;
              esac
              git add "$path"
            done
          fi
          git commit -m "merge(frontend): consolidate Issue #18/#32 implementation"

          # Replay only the post-fork changes for the two files where the
          # Issue #18 side was chosen.  --3way uses the fork blob embedded in
          # the patch and performs a semantic merge against the new file.
          replayed=0
          if [ -s /tmp/main-store.patch ]; then
            git apply --3way --index /tmp/main-store.patch
            replayed=1
          fi
          if [ -s /tmp/main-chat.patch ]; then
            git apply --3way --index /tmp/main-chat.patch
            replayed=1
          fi
          test -z "$(git ls-files -u)"
          if [ "$replayed" -eq 1 ] && ! git diff --cached --quiet; then
            git commit -m "merge(runtime): replay post-stack main fixes onto Issue #18 contracts"
          fi

          # Independent documentation-audit performance/artifact fix (#42).
          git merge --no-ff --no-edit origin/fix/register-documentation-audit
          test -z "$(git ls-files -u)"
          git diff --check e956e314c30f9b48d1894885003a55fbd13bf3e6...HEAD -- . ':(exclude)app/.gitignore'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install backend
        shell: bash
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction

      - name: Validate Issue #18 runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          poetry run ruff check --select F munin tests
          poetry run pytest -q \
            tests/test_run_cancel.py \
            tests/test_cancel_sse_events.py \
            tests/test_guidance_lifecycle.py \
            tests/test_guidance_lifecycle_e2e.py \
            tests/test_artifacts_store.py \
            tests/test_artifacts_endpoints.py \
            tests/test_asgi_artifacts.py \
            tests/test_run_detail_endpoint.py \
            tests/test_sandboxed_html_registry.py \
            tests/test_sse_workflow_events.py \
            tests/test_store_indexes.py \
            tests/test_discord_adapter.py \
            tests/test_compaction.py

      - name: Validate frontend
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run lint
          npm test -- --run

      - name: Publish the consolidated branch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-unify-prs.yml
          git commit -m "chore: remove one-shot consolidation workflow"
          git push origin HEAD:agent/unified-system-issue-18
