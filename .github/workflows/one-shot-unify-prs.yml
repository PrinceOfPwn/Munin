name: One-shot unify open PRs

on:
  push:
    branches:
      - agent/unified-system-issue-18
    paths:
      - .github/workflows/one-shot-unify-prs.yml

permissions:
  contents: write

concurrency:
  group: one-shot-unify-prs
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout unified branch with full history
        uses: actions/checkout@v4
        with:
          ref: agent/unified-system-issue-18
          fetch-depth: 0

      - name: Merge all independent open-PR work and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop fix/register-documentation-audit agent/valravn-burp-ultimate

          # This branch starts at PR #72 / current main. Keep that newer side only
          # for overlapping conflict hunks while merging every non-conflicting hunk
          # from the complete Issue #32 frontend/runtime chain.
          git merge --no-ff -X ours origin/develop \
            -m "merge(frontend): consolidate Issue #32 frontend/runtime chain"
          git merge --no-ff -X ours origin/fix/register-documentation-audit \
            -m "merge(ci): preserve documentation-audit cache and artifacts"

          test -z "$(git ls-files -u)"
          git diff --check origin/agent/valravn-burp-ultimate...HEAD
          git push origin HEAD:agent/unified-system-issue-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip poetry
          poetry install --no-interaction

      - name: Validate consolidated backend contracts
        shell: bash
        run: |
          set -euo pipefail
          poetry run ruff check --select F munin tests
          poetry run pytest -q \
            tests/test_run_cancel.py \
            tests/test_cancel_sse_events.py \
            tests/test_guidance_lifecycle.py \
            tests/test_guidance_lifecycle_e2e.py \
            tests/test_artifacts_store.py \
            tests/test_artifacts_endpoints.py \
            tests/test_asgi_artifacts.py \
            tests/test_run_detail_endpoint.py \
            tests/test_sandboxed_html_registry.py \
            tests/test_sse_workflow_events.py \
            tests/test_store_indexes.py \
            tests/test_discord_adapter.py \
            tests/test_compaction.py

      - name: Validate consolidated frontend
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npm run lint
          npm test -- --run
