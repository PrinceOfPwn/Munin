name: Apply Live Session Lab Integration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-live-lab-patch.yml"
      - "scripts/apply_live_lab_patch.py"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/enterprise-lab' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 scripts/apply_live_lab_patch.py

      - name: Validate resulting branch
        run: |
          git diff --check
          grep -q 'bkimminich/juice-shop:v20.0.0' .github/workflows/live-session.yml
          grep -q 'scripts/ldap_seed/70-enterprise-lab.ldif' .github/workflows/live-session.yml
          grep -q 'scripts/ldap_seed/71-enterprise-links.ldif' .github/workflows/live-session.yml
          grep -q '".github/workflows/live-session.yml"' .github/workflows/enterprise-lab-smoke.yml
          test ! -e .github/workflows/live-enterprise-lab.yml
          test ! -e .github/workflows/apply-live-lab-patch.yml
          test ! -e scripts/apply_live_lab_patch.py

      - name: Commit integrated Live Session
        run: |
          git config user.name "munin-lab-integrator"
          git config user.email "munin-lab-integrator@users.noreply.github.com"
          git add -A
          git commit -m "integrate enterprise lab into live session"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
