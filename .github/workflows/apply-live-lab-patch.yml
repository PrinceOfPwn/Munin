name: Apply Live Session Lab Integration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-live-lab-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/enterprise-lab' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Integrate lab into live-session.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/live-session.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '#   - Mock LDAP runs as a SERVICE container so both are on the same job network.',
                  '#   - Mock LDAP, Apache and Juice Shop run as SERVICE containers on the same private job network.',
              ),
              (
                  '    # Isolated LDAP + Apache fixtures are exposed only on the job network.',
                  '    # Isolated LDAP + Apache + Juice Shop fixtures are exposed only on the job network.',
              ),
              (
                  '''      apache:
        image: httpd:2.4.49

    env:''',
                  '''      apache:
        image: httpd:2.4.49
      juiceshop:
        # Fixed version: the laboratory must not change silently between sessions.
        image: bkimminich/juice-shop:v20.0.0

    env:''',
              ),
              (
                  '''      LDAP_PASSWORD: "itachi"
      # OPSEC + timeouts''',
                  '''      LDAP_PASSWORD: "itachi"
      # Enterprise laboratory targets — reachable only from this job network.
      MUNIN_LAB_WEB_URL:  "http://juiceshop:3000"
      MUNIN_LAB_WEB_HOST: "juiceshop"
      MUNIN_LAB_WEB_PORT: "3000"
      # OPSEC + timeouts''',
              ),
              (
                  '''      - name: Seed mock LDAP data
        run: |
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_mock.ldif 2>&1 | tail -20 || true
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_seed/60-web-lab.ldif

      - name: Wait for isolated Apache fixture
        run: |
          for i in $(seq 1 30); do
              if curl -fsSI http://apache:80/ >/dev/null; then
                  echo "Apache ready after ${i}s"
                  exit 0
              fi
              sleep 1
          done
          echo "::error::Apache fixture did not become ready" >&2
          exit 1
''',
                  '''      - name: Seed and validate complex enterprise LDAP
        run: |
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_mock.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_seed/60-web-lab.ldif
          ldapadd -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_seed/70-enterprise-lab.ldif
          ldapmodify -c -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -f scripts/ldap_seed/71-enterprise-links.ldif

          ldapsearch -LLL -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \\
              -b "$LDAP_BASE_DN" "(objectClass=*)" \\
              dn uid cn title employeeType description member owner objectClass \\
              > /tmp/enterprise-directory.ldif

          for expected in \\
            '^dn: cn=JUICE01,ou=computers,dc=akatsuki,dc=com$' \\
            '^uid: svc_juice$' \\
            '^title: HTTP/JUICE01.akatsuki.com:3000$' \\
            '^uid: breakglass_audit$' \\
            '^uid: legacy_batch$' \\
            '^member: cn=Tier-0 Automation,ou=groups,dc=akatsuki,dc=com$' \\
            '^member: cn=Production Deployers,ou=groups,dc=akatsuki,dc=com$' \\
            '^member: uid=vendor_zen,ou=Contractors,ou=Corp,dc=akatsuki,dc=com$'; do
              grep -q "$expected" /tmp/enterprise-directory.ldif
          done

          people=$(grep -c '^objectClass: inetOrgPerson$' /tmp/enterprise-directory.ldif || true)
          groups=$(grep -c '^objectClass: groupOfNames$' /tmp/enterprise-directory.ldif || true)
          devices=$(grep -c '^objectClass: device$' /tmp/enterprise-directory.ldif || true)
          spns=$(grep -Ec '^title: [A-Za-z0-9_-]+/.+' /tmp/enterprise-directory.ldif || true)
          asrep=$(grep -c '^employeeType: DONT_REQ_PREAUTH$' /tmp/enterprise-directory.ldif || true)

          test "$people" -ge 20
          test "$groups" -ge 18
          test "$devices" -ge 14
          test "$spns" -ge 10
          test "$asrep" -ge 4

          {
            echo "LDAP_PEOPLE=${people}"
            echo "LDAP_GROUPS=${groups}"
            echo "LDAP_DEVICES=${devices}"
            echo "LDAP_SPNS=${spns}"
            echo "LDAP_ASREP=${asrep}"
          } >> "$GITHUB_ENV"

      - name: Wait for isolated web fixtures
        run: |
          for i in $(seq 1 45); do
              if curl -fsSI http://apache:80/ >/dev/null; then
                  echo "Apache ready after ${i}s"
                  break
              fi
              test "$i" -lt 45 || {
                  echo "::error::Apache fixture did not become ready" >&2
                  exit 1
              }
              sleep 1
          done

          for i in $(seq 1 90); do
              if curl -fsS "$MUNIN_LAB_WEB_URL/" -o /tmp/juice-shop-index.html; then
                  grep -Eqi 'juice|app-root|<html' /tmp/juice-shop-index.html
                  curl -fsSI "$MUNIN_LAB_WEB_URL/" > /tmp/juice-shop-headers.txt
                  echo "Juice Shop ready after $((i * 2))s"
                  break
              fi
              test "$i" -lt 90 || {
                  echo "::error::Juice Shop fixture did not become ready" >&2
                  exit 1
              }
              sleep 2
          done

          nmap -Pn -sT -p 80 apache -oN /tmp/apache-ports.txt
          nmap -Pn -sT -p "$MUNIN_LAB_WEB_PORT" "$MUNIN_LAB_WEB_HOST" -oN /tmp/juice-shop-ports.txt
          grep -q '80/tcp.*open' /tmp/apache-ports.txt
          grep -q '3000/tcp.*open' /tmp/juice-shop-ports.txt
''',
              ),
              (
                  '''              'smbmap_scan', 'netexec_scan', 'munin_diagnostics',
''',
                  '''              'smbmap_scan', 'netexec_scan', 'munin_diagnostics',
              'ldap_search', 'find_kerberoastable_users',
              'find_asrep_roastable_users',
''',
              ),
              (
                  '''          print('OK — nmap_scan executed through MCP against the authorized LDAP service')
          PY
''',
                  '''          print('OK — nmap_scan executed through MCP against the authorized LDAP service')

          juice_message = rpc(
              4,
              'tools/call',
              {
                  'name': 'nmap_scan',
                  'arguments': {
                      'target': os.environ['MUNIN_LAB_WEB_HOST'],
                      'scan_type': '-sV',
                      'ports': os.environ['MUNIN_LAB_WEB_PORT'],
                      'additional_args': '-Pn',
                      'mode': 'sync',
                      'timeout': 90,
                      'run_id': f'ci-juice-nmap-{os.environ.get("GITHUB_RUN_ID", "manual")}',
                  },
              },
              timeout=120,
          )
          juice_rendered = json.dumps(juice_message, ensure_ascii=False)
          if (
              juice_message.get('error')
              or juice_message.get('result', {}).get('isError')
              or 'missing_dependency' in juice_rendered
              or '3000/tcp' not in juice_rendered
          ):
              print(f'::error::Juice Shop nmap MCP smoke failed: {juice_rendered}', file=sys.stderr)
              sys.exit(1)
          print('OK — nmap_scan executed through MCP against the authorized Juice Shop box')
          PY
''',
              ),
              (
                  '''          | **MCP URL** | \\`${MCP_URL}\\` |
          | **GUI authentication** |''',
                  '''          | **MCP URL** | \\`${MCP_URL}\\` |
          | **Vulnerable web box** | \\`http://juiceshop:3000\\` |
          | **Directory** | \\`ldap://ldap:389\\` / \\`dc=akatsuki,dc=com\\` |
          | **Legacy web fixture** | \\`http://apache:80\\` |
          | **LDAP identities** | \\`${LDAP_PEOPLE}\\` |
          | **LDAP groups** | \\`${LDAP_GROUPS}\\` |
          | **LDAP devices** | \\`${LDAP_DEVICES}\\` |
          | **SPN-like identities** | \\`${LDAP_SPNS}\\` |
          | **DONT_REQ_PREAUTH identities** | \\`${LDAP_ASREP}\\` |
          | **GUI authentication** |''',
              ),
              (
                  '''          | **Runner** | \\`kalilinux/kali-rolling\\` (offensive toolchain installed and verified) |

          Quick test:''',
                  '''          | **Runner** | \\`kalilinux/kali-rolling\\` (offensive toolchain installed and verified) |

          Suggested objective:

          > Investigate the authorized AKATSUKI laboratory as an unknown enterprise
          > environment. Enumerate exposed services, correlate application and directory
          > evidence, identify credible attack paths, validate findings without denial
          > of service or container escape, and produce an evidence-backed report that
          > separates confirmed facts, inferences and unknowns.

          Authorized targets: \\`juiceshop\\`, \\`ldap\\`, and \\`apache\\`.

          Quick test:''',
              ),
              (
                  '''              if ! curl -fsS http://127.0.0.1:8787/health >/dev/null; then
                echo "::warning::production API health check failed"
              fi
              sleep 300
''',
                  '''              if ! curl -fsS http://127.0.0.1:8787/health >/dev/null; then
                echo "::warning::production API health check failed"
              fi
              if ! curl -fsS "$MUNIN_LAB_WEB_URL/" >/dev/null; then
                echo "::warning::Juice Shop health check failed"
              fi
              sleep 300
''',
              ),
              (
                  '''          echo "── production API health snapshot ──"
          curl -fsS http://127.0.0.1:8787/health 2>&1 || echo "(production API unreachable)"
''',
                  '''          echo "── production API health snapshot ──"
          curl -fsS http://127.0.0.1:8787/health 2>&1 || echo "(production API unreachable)"
          echo "── Juice Shop health snapshot ──"
          curl -fsSI "$MUNIN_LAB_WEB_URL/" 2>&1 || echo "(Juice Shop unreachable)"
          echo "── enterprise LDAP summary ──"
          grep -E '^(dn|uid|cn|title|employeeType|member|owner): ' /tmp/enterprise-directory.ldif 2>/dev/null | tail -100 || true
''',
              ),
              (
                  '''            /tmp/gui-tunnel.log
            data/events.jsonl
''',
                  '''            /tmp/gui-tunnel.log
            /tmp/juice-shop-index.html
            /tmp/juice-shop-headers.txt
            /tmp/juice-shop-ports.txt
            /tmp/apache-ports.txt
            /tmp/enterprise-directory.ldif
            data/events.jsonl
''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement target, found {count}: {old.splitlines()[0]!r}')
              text = text.replace(old, new)

          required = [
              'image: bkimminich/juice-shop:v20.0.0',
              '-f scripts/ldap_seed/70-enterprise-lab.ldif',
              '-f scripts/ldap_seed/71-enterprise-links.ldif',
              "'target': os.environ['MUNIN_LAB_WEB_HOST']",
              '| **Vulnerable web box** |',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing integrated marker: {marker}')

          path.write_text(text, encoding='utf-8')

          smoke = Path('.github/workflows/enterprise-lab-smoke.yml')
          smoke_text = smoke.read_text(encoding='utf-8')
          old_path = '      - ".github/workflows/live-enterprise-lab.yml"'
          new_path = '      - ".github/workflows/live-session.yml"'
          if smoke_text.count(old_path) != 1:
              raise SystemExit('enterprise smoke workflow path was not uniquely replaceable')
          smoke.write_text(smoke_text.replace(old_path, new_path), encoding='utf-8')

          enterprise = Path('.github/workflows/live-enterprise-lab.yml')
          if enterprise.exists():
              enterprise.unlink()

          Path('.github/workflows/apply-live-lab-patch.yml').unlink()
          PY

      - name: Validate and push resulting PR branch
        run: |
          git diff --check
          grep -q 'bkimminich/juice-shop:v20.0.0' .github/workflows/live-session.yml
          grep -q 'scripts/ldap_seed/70-enterprise-lab.ldif' .github/workflows/live-session.yml
          grep -q 'scripts/ldap_seed/71-enterprise-links.ldif' .github/workflows/live-session.yml
          test ! -e .github/workflows/live-enterprise-lab.yml
          test ! -e .github/workflows/apply-live-lab-patch.yml

          git config user.name "munin-lab-integrator"
          git config user.email "munin-lab-integrator@users.noreply.github.com"
          git add .github/workflows/live-session.yml \
                  .github/workflows/enterprise-lab-smoke.yml \
                  .github/workflows/live-enterprise-lab.yml \
                  .github/workflows/apply-live-lab-patch.yml
          git commit -m "integrate enterprise lab into live session"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
