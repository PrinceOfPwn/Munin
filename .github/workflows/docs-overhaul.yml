          files['AGENTS.md'] = r'''# Working on Munin

This file is for coding agents and contributors working on `PrinceOfPwn/Munin`.
It describes the repository as it exists in v1.0.0; it is not an instruction to
run the CTF-oriented prompts in `soul/` as a default personality.

## Project contract

Munin is a durable, operator-governed runtime for autonomous security
operations. The server owns identity, policy, approvals, state and capability
composition. The web GUI, MCP and Discord are control surfaces over the same
runtime.

The configuration tested for **v1.0.0** is:

- Web GUI
- GitHub Actions execution environment
- MiMo V2.5

Other combinations may work, but they are not part of the verified v1.0.0
matrix unless documented.

## Repository map

```text
app/                    Next.js 15 / React 18 / TypeScript web GUI
munin/                  Python 3.11+ backend and runtime
  core/                 prompting, model integration and autonomy contracts
  production/           ASGI API, durable chat, runs, events and recovery
  mcp/                  MCP transport and native capabilities
  valravn/              external reconnaissance and CTI mesh
soul/                   optional, human-governed persona packages
scripts/                operational and maintenance scripts
docs/                   canonical documentation and translations
tests/                  backend and integration tests
.github/workflows/       CI, verified runner path and operational workflows
```

## Rules for changes

1. Read the live code before trusting a static capability list.
2. Keep authority server-side. A UI, skill or prompt must never bypass policy.
3. Preserve the separation between checkpoints, event history and artifacts.
4. Treat `soul/` as optional characterization. The bundled Soul is specialized
   for CTF/lab scenarios and is not the recommended production default.
5. Do not claim a model or deployment is verified unless it is in the documented
   compatibility matrix.
6. Update documentation when behavior, interfaces, storage or workflows change.

## Validation

```bash
poetry run pytest
cd app && npm run build
```

CI is the authoritative integration environment. Local validation is useful,
but the v1.0.0 verified path is the GUI on GitHub Actions with MiMo V2.5.

## Documentation

Start at [docs/README.md](docs/README.md). Architecture is defined in
[ARCHITECTURE.md](ARCHITECTURE.md), and the current system inventory is in
[MAP.md](MAP.md).
'''

