          files['docs/architecture.md'] = r'''# Runtime architecture

`munin serve` hosts the authenticated API, streamable MCP endpoint and optional
Discord adapter. All surfaces share one policy, identity, persistence and
capability boundary.

## Execution path

1. The server authenticates the actor and resolves the conversation.
2. It creates or reuses an idempotent run and claims a renewable lease.
3. The supervisor loads the stable LangGraph thread, evidence and live registry.
4. Model, activity, tool, artifact and approval events are persisted and streamed.
5. Completion, failure, cancellation or interruption updates durable run state.
6. Reconnecting clients replay the event log without repeating model work.

## Control surfaces

| Endpoint | Purpose |
| --- | --- |
| `/api/*` | GUI and authenticated application operations |
| `/api/chat/{conversation_id}/stream` | Durable event replay and live follow |
| `/api/human-requests/{id}/resolve` | Resolve one exact persisted request |
| `/mcp/` | Discover and invoke the live MCP capability surface |

## Operation modes

Standard, YOLO, GOAL and BEAST change autonomy budgets and approval behavior.
They do not remove the critical approval floor, audit, secret redaction or
server-side policy.

## Observability

Munin stores final text, provider-emitted reasoning, operational activity, tool
lifecycle, specialist activity, artifacts, approvals and terminal state as
separate event families. It does not fabricate hidden chain of thought.
'''

          files['docs/architecture-persistence.md'] = r'''# Persistence and recovery

Munin requires three forms of continuity:

| Store | Purpose |
| --- | --- |
| Hot application store | Accounts, conversations, runs, events, calls and approvals |
| LangGraph checkpoint store | Executable state for a stable conversation thread |
| Optional durable archive | Long-lived mirrored records through libSQL/Turso |

A reconnect reads events. A process recovery restores executable state from a
checkpoint. These are different mechanisms and both must be persisted.

## Recovery rules

- Expired leases fence lost executors.
- Recoverable runs reuse the same conversation thread.
- Completed calls must not be duplicated.
- `waiting_for_human` runs remain paused until an authenticated decision.
- A missing store degrades the associated guarantee and must be reported.

## Deployment

Persist the hot database and checkpoint database on durable storage. Keep
provider tokens in the platform secret manager. Do not assume an ephemeral
GitHub Actions filesystem is durable without artifacts or remote storage.
'''

          files['docs/munin-system-guide.md'] = r'''# Munin system guide

## Start an operation

Provide an objective, explicit authorized scope, expected evidence and the
autonomy mode. The server creates or resumes a stable conversation.

## Follow progress

Use the GUI timeline for the richest view. MCP and Discord access the same
server-owned run. Activity, tools, artifacts and approvals are independent
events rather than one reconstructed status message.

## Human approval

A sensitive call pauses with its exact capability and arguments. Approval
resumes that action. Rejection or expiry closes it. Approval cannot be reused
for another run or modified call.

## Evidence

High-confidence conclusions should reference tool output, provider attribution,
retrieval time and artifacts. Hugin and Valravn observations remain external
research until validated for the authorized target.

## Soul

The included Soul is CTF-oriented characterization. Use a neutral or
organization-specific Soul for normal deployments, and change it through the
reviewed Soul proposal workflow.
'''

          files['docs/operator-guide.md'] = r'''# Operator guide

## Before starting

- Confirm written authorization and target boundaries.
- Verify `/health`, authentication and origin policy.
- Test one structured tool-call round trip with the selected model.
- Inspect the live registry rather than a copied capability list.
- Confirm persistent hot and checkpoint storage.
- Define who can approve, reject and cancel actions.

## Verified v1.0.0 configuration

Web GUI + GitHub Actions + MiMo V2.5 is the tested configuration. Treat other
models and deployment targets as experimental until validated.

## During an operation

Watch the event timeline, evidence and pending approvals. Cancel the run if the
scope changes, credentials are exposed, routing is unsafe or results contradict
the expected environment.

## Recovery

After a process loss, verify lease expiry, checkpoint availability and replayed
events before allowing additional execution. Pending approvals must remain
paused.

## Production notes

Use durable storage, a protected reverse proxy, strict origins, strong tokens,
secret management and retention policies. Do not deploy the bundled CTF Soul as
a production default.
'''

