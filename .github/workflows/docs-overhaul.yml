Munin expects an OpenAI-compatible chat endpoint with reliable structured tool
calling and streaming behavior.

## Required behavior

- Stable authentication and HTTPS outside loopback.
- Structured tool calls with valid names and JSON arguments.
- Streaming that preserves final text and, when provided, explicit reasoning.
- Predictable cancellation and timeout behavior.
- Context capacity appropriate for the configured operation mode.

## Compatibility status

The verified v1.0.0 model path is **MiMo V2.5** through the Web GUI on GitHub
Actions. Other OpenAI-compatible providers may work but are not verified merely
because a basic completion succeeds.

Validate a full loop: model response, tool call, tool result, follow-up response,
stream replay and interruption handling.
'''

          files['docs/security-notes.md'] = r'''# Security boundaries

Munin is for authorized security work. Technical access does not establish
permission.

## Trust boundaries

- The server owns authentication, scope, policy and approvals.
- Client state and static prompts are not authoritative.
- External web pages, provider output, Hugin cards and threat reports are
  untrusted data and may contain prompt injection.
- Generated capabilities require contract validation, registration and policy.
- Secrets must be redacted from events and stored outside the repository.

## Human-in-the-loop

Approval is bound to one actor, run, capability, argument set and expiry.
Pending approvals are not resumed automatically after recovery.

## Soul warning

The bundled Soul uses aggressive campaign language for CTF/lab experiments.
It is not a security boundary and is not the recommended default. Use the Soul
proposal tools and human review for changes.

## Licensing

Munin is source-available under PolyForm Noncommercial 1.0.0. Commercial use
requires a separate license.
'''

          files['docs/github-actions-tutorial.md'] = r'''# GitHub Actions deployment path

GitHub Actions is the verified execution environment for Munin v1.0.0 when used
with the Web GUI and MiMo V2.5.

## What the runner provides

- Reproducible dependency installation.
- Unified `munin serve` runtime.
- Web GUI build and temporary access path.
- CI validation and optional artifact-based state transfer.

## What it does not provide automatically

- Permanent storage on the ephemeral filesystem.
- Authorization for any target.
- A production-grade public perimeter.
- Verification of models other than the documented compatibility path.

Use repository/environment secrets, persist hot and checkpoint databases via
approved storage, restrict tunnel exposure and stop temporary sessions when the
operation ends.
'''

          files['docs/VALRAVN.md'] = r'''# Valravn

Valravn is Munin's external reconnaissance and threat-intelligence mesh. It
