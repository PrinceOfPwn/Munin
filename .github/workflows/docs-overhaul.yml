          files['ARCHITECTURE.md'] = r'''# Munin architecture

Munin is a single governed runtime with multiple control surfaces. Identity,
policy, approvals, durable state and capability composition remain server-side.

## Layers

| Layer | Responsibility |
| --- | --- |
| Interfaces | GUI, API, MCP and optional Discord presentation |
| Control plane | Authentication, scope, policy, approvals and run ownership |
| Agent runtime | Deep Agents/LangGraph execution, delegation and tool calling |
| Capability plane | Native tools, Valravn, reviewed skills and `gen__*` tools |
| State plane | Conversations, runs, events, checkpoints and artifacts |
| Knowledge plane | Hugin and source-attributed external research |

## Run lifecycle

```mermaid
stateDiagram-v2
  [*] --> queued
  queued --> running: lease claimed
  running --> waiting_for_human: exact action interrupted
  waiting_for_human --> running: approved
  waiting_for_human --> cancelled: rejected or expired
  running --> completed
  running --> failed
  running --> cancelled
  failed --> queued: recoverable lease/checkpoint
```

Each conversation has a stable LangGraph thread. Renewable leases fence
executors, durable events support replay, and checkpoints support executable
recovery. A pending approval is never automatically executed by recovery.

## State separation

| Mechanism | Preserves |
| --- | --- |
| Hot store | Conversations, messages, runs, events, calls, approvals and artifacts |
| Checkpoint store | Executable LangGraph state for the stable thread |
| Archive | Optional long-lived mirrored records through libSQL/Turso |
| Context compaction | Smaller model input, not the audit history |

## Capability model

The live registry is assembled at runtime. Native capabilities, generated
`gen__*` tools and bounded specialists must pass the same policy boundary.
A file on disk, a skill, a Hugin result or a Soul instruction does not grant
authority.

## Soul model

The bundled `soul/*.md` files are a specific experimental characterization for
CTFs and controlled labs. They are not the expected default for production,
defensive or enterprise deployments. Soul changes are proposed through the
human-governed Soul tools and reviewed before adoption.

## Compatibility

The tested v1.0.0 configuration is Web GUI + GitHub Actions + MiMo V2.5.
Provider-compatible endpoints and other deployment targets may work but remain
unverified until added to the compatibility documentation.
'''

