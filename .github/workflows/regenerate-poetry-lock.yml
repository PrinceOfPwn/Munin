name: Regenerate Poetry Lock

# Temporary workflow to regenerate poetry.lock after pyproject.toml changes
# (e.g. when a dependency is added but `poetry lock` cannot be run locally).
# Triggered manually; commits the refreshed poetry.lock back to the dispatch
# branch. Safe to delete after the lock is updated.

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Commit message for the lock update"
        required: false
        default: "chore(deps): regenerate poetry.lock after pyproject.toml change"
  push:
    branches:
      - raven-mind/integrate-valravn
    paths:
      - .github/workflows/regenerate-poetry-lock.yml
      - pyproject.toml

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Regenerate poetry.lock (no version bumps)
        # Poetry 2.x dropped `--no-update`; bare `poetry lock` regenerates
        # the lock in place without bumping already-resolved versions.
        run: poetry lock

      - name: Show lock diff (first 200 lines)
        run: |
          if git diff --quiet poetry.lock; then
            echo "No lock changes -- already in sync"
          else
            git --no-pager diff --stat poetry.lock
            git --no-pager diff poetry.lock | head -n 200
          fi

      - name: Commit refreshed poetry.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="${{ inputs.commit_message }}"
          if [ -z "$MSG" ]; then MSG="chore(deps): regenerate poetry.lock after pyproject.toml change"; fi
          if git diff --quiet poetry.lock; then
            echo "No lock changes to commit"
          else
            git add poetry.lock
            git commit -m "$MSG"
            git push
            echo "Pushed lock update to ${{ github.ref_name }}"
          fi
      - name: Verify install now resolves
        run: poetry install --no-interaction
