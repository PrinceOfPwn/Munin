name: Prepare PR 13 review fixes

on:
  pull_request:
    branches:
      - agent/live-command-output-stream

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'maintenance/pr13-review-fixes-build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            fetch --no-tags origin "$HEAD_SHA"
          git checkout -B "$HEAD_REF" FETCH_HEAD

      - name: Apply reviewed fixes
        run: python scripts/_apply_pr13_review_fixes.py

      - name: Validate Python syntax and focused backend tests
        run: |
          python -m pip install --upgrade pip poetry==2.3.2
          poetry install --no-interaction --no-ansi --sync
          poetry run python -m compileall -q munin tests scripts
          poetry run python -m pytest -q \
            tests/test_live_process_output.py \
            tests/test_deepagents_skills.py \
            tests/characterization/test_progress_emit_middleware.py \
            tests/test_restore_munin_artifact.py

      - name: Validate frontend
        working-directory: app
        run: |
          npm ci --no-audit
          npm run typecheck
          npm test
          npm run lint
          npm run build

      - name: Commit validated code to the build branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "munin-review-fix-bot"
          git config user.email "munin-review-fix-bot@users.noreply.github.com"
          git add \
            munin/mcp/opsec.py \
            munin/mcp/jobs.py \
            munin/mcp/main.py \
            munin/core/runtime_adapter.py \
            munin/core/middleware/progress_emit.py \
            munin/core/autonomy/skill_library.py \
            munin/production/store.py \
            munin/production/asgi.py \
            app/src/components/AgentConsole.tsx \
            app/src/components/chat/blocks/parts/ArtifactPart.tsx \
            app/src/components/chat/blocks/parts/ToolHeartbeatPart.tsx \
            app/src/lib/aiChat.ts \
            app/src/lib/chat/translator.ts \
            app/src/lib/__tests__/translator.test.ts \
            tests/test_live_process_output.py \
            tests/test_deepagents_skills.py \
            tests/characterization/test_progress_emit_middleware.py
          git diff --cached --check
          git commit -m "fix: address PR review findings"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:${HEAD_REF}"
