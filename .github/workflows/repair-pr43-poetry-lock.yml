name: Repair PR43 Poetry Lock

on:
  push:
    branches:
      - raven-mind/integrate-valravn
    paths:
      - .github/workflows/repair-pr43-poetry-lock.yml
      - pyproject.toml
      - poetry.lock

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate lock from current pyproject
        run: |
          python -m pip install --upgrade pip
          pip install 'poetry==2.4.1'
          rm -f poetry.lock
          poetry lock
          poetry check --lock
      - name: Commit repaired lock
        run: |
          if git diff --quiet -- poetry.lock; then
            echo 'poetry.lock already consistent'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock
          git commit -m 'fix(ci): regenerate poetry lock after merge'
          git push origin HEAD:raven-mind/integrate-valravn
