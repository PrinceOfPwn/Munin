name: Munin Live Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duracion de la sesion en minutos (max 55)"
        required: true
        default: "30"
        type: number

jobs:
  munin:
    name: "Munin sesion ${{ inputs.duration_minutes }}min"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LLM_BASE_URL:         ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY:          ${{ secrets.LLM_API_KEY }}
      LLM_MODEL:            ${{ secrets.LLM_MODEL }}
      MUNIN_MCP_AUTH_TOKEN: ${{ secrets.MUNIN_MCP_AUTH_TOKEN }}
      LDAP_URI:             ldap://localhost:389
      LDAP_BASE_DN:         dc=meli,dc=com
      LDAP_BIND_DN:         cn=admin,dc=meli,dc=com
      LDAP_PASSWORD:        itachi
      PREFLIGHT_POLICY:     active_only
      LLM_TIMEOUT_FLOOR:    "40"
      LLM_TIMEOUT_CEILING:  "240"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ldap-utils

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Munin
        run: poetry install --no-interaction

      - name: Start mock LDAP
        run: |
          docker run -d --name munin_ldap_mock -p 389:389 \
            -e LDAP_ORGANISATION="MELI" \
            -e LDAP_DOMAIN="meli.com" \
            -e LDAP_BASE_DN="dc=meli,dc=com" \
            -e LDAP_ADMIN_PASSWORD="itachi" \
            -e LDAP_CONFIG_PASSWORD="itachi" \
            -e LDAP_TLS="false" \
            osixia/openldap:1.5.0

      - name: Wait for LDAP
        run: |
          echo "Esperando LDAP..."
          for i in $(seq 1 30); do
            if ldapsearch -H ldap://localhost:389 -x \
              -D "cn=admin,dc=meli,dc=com" -w "itachi" \
              -b "dc=meli,dc=com" "(objectClass=*)" dn 2>/dev/null \
              | grep -q "result: 0"; then
              echo "LDAP listo en ${i}s"
              break
            fi
            sleep 1
          done

      - name: Seed mock data
        run: |
          ldapadd -H ldap://localhost:389 -x \
            -D "cn=admin,dc=meli,dc=com" -w "itachi" \
            -f scripts/ldap_mock.ldif 2>&1 | tail -5 || true

      - name: Build Next.js Frontend
        run: |
          if [ -d "app" ]; then
            cd app
            npm install
            npm run build
          fi

      - name: Start Munin MCP
        run: |
          mkdir -p data soul
          # Lanzar con uvicorn directamente para poder pasar --proxy-headers y
          # --forwarded-allow-ips=* (necesario para que ngrok no de 421)
          # y montar la app estática de Next.js en /
          nohup poetry run python3 -c "
          from pathlib import Path
          from starlette.middleware.base import BaseHTTPMiddleware
          from starlette.responses import Response
          import munin.mcp.main
          import uvicorn
          from starlette.staticfiles import StaticFiles

          class UniversalCorsMiddleware(BaseHTTPMiddleware):
              async def dispatch(self, request, call_next):
                  if request.method == 'OPTIONS':
                      return Response(
                          status_code=200,
                          headers={
                              'Access-Control-Allow-Origin': '*',
                              'Access-Control-Allow-Methods': '*',
                              'Access-Control-Allow-Headers': '*',
                              'Access-Control-Max-Age': '86400',
                          },
                      )

                  # Strip origin and normalize host header in request.scope to bypass FastMCP internal checks
                  headers = []
                  for k, v in request.scope.get('headers', []):
                      if k.lower() == b'host':
                          headers.append((b'host', b'localhost:8890'))
                      elif k.lower() == b'origin':
                          continue
                      else:
                          headers.append((k, v))
                  request.scope['headers'] = headers

                  response = await call_next(request)
                  response.headers['Access-Control-Allow-Origin'] = '*'
                  response.headers['Access-Control-Allow-Methods'] = '*'
                  response.headers['Access-Control-Allow-Headers'] = '*'
                  response.headers['Cache-Control'] = 'no-cache, no-store, must-revalidate'
                  return response

          app = munin.mcp.main.MCP.streamable_http_app()
          app.add_middleware(UniversalCorsMiddleware)
          static_dir = Path('app/out')
          if static_dir.exists():
              app.mount('/', StaticFiles(directory=str(static_dir), html=True), name='frontend')

          uvicorn.run(app, host='0.0.0.0', port=8890,
                      proxy_headers=True, forwarded_allow_ips='*')
          " > /tmp/munin.log 2>&1 &
          sleep 8


      - name: Verify Munin
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          url = 'http://localhost:8890/mcp'
          token = os.environ.get('MUNIN_MCP_AUTH_TOKEN', '')

          req_init = urllib.request.Request(
              url,
              data=json.dumps({
                  'jsonrpc': '2.0',
                  'id': 1,
                  'method': 'initialize',
                  'params': {
                      'protocolVersion': '2024-11-05',
                      'capabilities': {},
                      'clientInfo': {'name': 'verifier', 'version': '1.0'},
                  },
              }).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream',
                  'Authorization': f'Bearer {token}',
              },
          )

          with urllib.request.urlopen(req_init) as resp:
              raw = resp.read().decode()
              sid = resp.headers.get('mcp-session-id', '')
              print(f"Verified MCP initialize -> HTTP {resp.status} session={sid}")

          req_list = urllib.request.Request(
              url,
              data=json.dumps({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list', 'params': {}}).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream',
                  'Authorization': f'Bearer {token}',
                  'mcp-session-id': sid,
              },
          )

          with urllib.request.urlopen(req_list) as resp:
              raw = resp.read().decode()
              print(f"Verified MCP tools/list -> HTTP {resp.status}")
          PYEOF

      - name: Open public tunnel (ngrok)
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          LOG=/tmp/tunnel.log
          # Instalar ngrok
          curl -fsSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz -C /usr/local/bin
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          # --pooling-enabled y --host-header=rewrite para compatibilidad total con browser fetch
          ngrok http 8890 --log=stdout --pooling-enabled --host-header=rewrite > "$LOG" 2>&1 &
          # Esperar hasta 30s a que ngrok publique la URL
          for i in $(seq 1 30); do
            TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tunnels'][0]['public_url'])" 2>/dev/null || true)
            [ -n "$TUNNEL_URL" ] && break
            sleep 1
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: No se pudo abrir tunnel"
            cat "$LOG" >&2
            exit 1
          fi
          echo "MUNIN_PUBLIC_URL=${TUNNEL_URL}" >> "$GITHUB_ENV"
          echo "Tunnel URL: ${TUNNEL_URL}"

      - name: Print connection info
        run: |
          URL="${MUNIN_PUBLIC_URL}"
          TOKEN="${MUNIN_MCP_AUTH_TOKEN}"
          echo "============================================"
          echo "  MUNIN EN VIVO"
          echo "  URL  : ${URL}"
          echo "  Token: ${TOKEN}"
          echo "============================================"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Munin en vivo ✅

          | Campo | Valor |
          |-------|-------|
          | **MCP URL** | \`${URL}/mcp\` |
          | **Token** | \`${TOKEN}\` |
          | **Duración** | ${{ inputs.duration_minutes }} min |

          ### Conectar desde Claude Code (~/.claude.json)
          \`\`\`json
          {
            "mcpServers": {
              "munin": {
                "type": "http",
                "url": "${URL}/mcp",
                "headers": { "Authorization": "Bearer ${TOKEN}" }
              }
            }
          }
          \`\`\`

          ### Test rápido (curl)
          \`\`\`bash
          # Paso 1 - inicializar sesión y guardar session-id
          SESSION=\$(curl -s -X POST ${URL}/mcp \\
            -H "Authorization: Bearer ${TOKEN}" \\
            -H "Content-Type: application/json" \\
            -H "Accept: application/json, text/event-stream" \\
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1"}}}' \\
            -D - | grep -i mcp-session-id | awk '{print \$2}' | tr -d '\r')

          # Paso 2 - listar tools
          curl -s -X POST ${URL}/mcp \\
            -H "Authorization: Bearer ${TOKEN}" \\
            -H "Content-Type: application/json" \\
            -H "Accept: application/json, text/event-stream" \\
            -H "mcp-session-id: \$SESSION" \\
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          \`\`\`
          SUMMARY

      - name: Keep alive
        run: sleep $(( ${{ inputs.duration_minutes }} * 60 ))

      - name: Logs
        if: always()
        run: |
          echo "=== Munin log ==="
          tail -50 /tmp/munin.log 2>/dev/null || true
          echo "=== Tunnel log ==="
          cat /tmp/tunnel.log 2>/dev/null || true
