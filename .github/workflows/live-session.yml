name: Live session (manual)

# Runs a Munin end-to-end session against the LangGraph supervisor and
# uploads run artifacts. Manual dispatch only — never auto-triggers.
#
# Requires repository secrets:
#   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Goal / prompt to execute"
        required: true
        type: string
      max_iterations:
        description: "Max supervisor iterations"
        required: false
        default: "20"
        type: string
      timeout_minutes:
        description: "Total workflow timeout (max 240)"
        required: false
        default: "60"
        type: string
      preflight_policy:
        description: "Munin preflight policy (lab/prod/off)"
        required: false
        default: "lab"
        type: string

jobs:
  live-session:
    name: Live Munin session
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: live-session
      cancel-in-progress: false

    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      MUNIN_LANGGRAPH_URL: "http://localhost:8123"
      MUNIN_LANGGRAPH_PORT: "8123"
      MUNIN_DB_PATH: "data/munin-ci.db"
      PREFLIGHT_POLICY: ${{ inputs.preflight_policy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install project
        run: poetry install --no-interaction

      - name: Generate LangGraph API key
        id: keygen
        run: |
          KEY=$(poetry run python scripts/langgraph_generate_key.py)
          echo "::add-mask::$KEY"
          echo "LANGGRAPH_API_KEY=$KEY" >> $GITHUB_ENV

      - name: Start LangGraph server
        run: |
          mkdir -p logs data
          poetry run langgraph dev --port 8123 > logs/langgraph.log 2>&1 &
          echo "LANGGRAPH_PID=$!" >> $GITHUB_ENV

      - name: Wait for LangGraph health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8123/ok >/dev/null 2>&1 \
               || curl -fsS http://localhost:8123/health >/dev/null 2>&1; then
              echo "LangGraph server is up"
              exit 0
            fi
            sleep 2
          done
          echo "LangGraph server failed to start"
          tail -100 logs/langgraph.log || true
          exit 1

      - name: Heartbeat (background)
        run: |
          (
            while true; do
              echo "[heartbeat] $(date -u +%FT%TZ)"
              sleep 60
            done
          ) &
          echo "HEARTBEAT_PID=$!" >> $GITHUB_ENV

      - name: Run Munin session
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
        run: |
          set -o pipefail
          echo "${{ inputs.goal }}" | \
            poetry run munin run --max-iterations ${{ inputs.max_iterations }} \
            2>&1 | tee logs/session.log

      - name: Stop heartbeat + LangGraph
        if: always()
        run: |
          kill $HEARTBEAT_PID 2>/dev/null || true
          kill $LANGGRAPH_PID 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munin-live-session-${{ github.run_id }}
          path: |
            logs/
            data/
            evidence/
            runs/
            reports/
          retention-days: 14
          if-no-files-found: warn
