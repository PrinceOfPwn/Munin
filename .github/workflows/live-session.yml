# Munin Live Session — GitHub Actions runner with Kali offensive toolchain.
#
# Runs on ubuntu-latest but executes Munin INSIDE a Kali rolling container.
# The rolling container is intentionally minimal, so the workflow installs and
# verifies Munin's offensive binaries before the server is allowed to start.
#
# Design decisions:
#   - Runner OS = ubuntu-latest (only supported by GitHub Actions for now).
#   - Job container = kalilinux/kali-rolling (offensive toolchain baked in).
#   - Mock LDAP runs as a SERVICE container so both are on the same job network.
#   - Poetry runs INSIDE the Kali container (installed on first step).
#   - Public tunnel via localhost.run / cloudflared → open_tunnel.sh handles fallback.
#
# Manual trigger only. Duration configurable per-run (max 55 min — hard capped by
# GitHub free-tier 6h job limit but we self-cap for safety).

name: Munin Live Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Session duration in minutes (max 55)"
        required: true
        default: "30"
        type: number
      preflight_policy:
        description: "OPSEC preflight policy"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "active_only"
          - "always"
      munin_max_iterations:
        description: "MUNIN_MAX_ITERATIONS — leave blank for no cap"
        required: false
        default: ""
        type: string
      persist_state:
        description: "Roundtrip shared_state.sqlite via artifact (soul + memory + forge state)"
        required: true
        default: true
        type: boolean
      open_public_tunnel:
        description: "Expose the authenticated MCP through a temporary public tunnel"
        required: true
        default: false
        type: boolean

# Required so Munin can commit forged tools + open soul-proposal PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  munin:
    name: "Munin session (${{ inputs.duration_minutes }}min · Kali)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # We run as root inside the container (Kali's default) so installed
    # offensive binaries can bind raw sockets when a graph authorizes it.
    container:
      image: kalilinux/kali-rolling
      options: --user root

    # OpenLDAP mock exposed at 389 on the job network.
    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "MELI"
          LDAP_DOMAIN: "meli.com"
          LDAP_BASE_DN: "dc=meli,dc=com"
          LDAP_ADMIN_PASSWORD: "itachi"
          LDAP_CONFIG_PASSWORD: "itachi"
          LDAP_TLS: "false"
        ports:
          - 389:389

    env:
      # LLM
      LLM_BASE_URL:         ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY:          ${{ secrets.LLM_API_KEY }}
      LLM_MODEL:            ${{ secrets.LLM_MODEL }}
      # MCP
      MUNIN_MCP_AUTH_TOKEN: ${{ secrets.MUNIN_MCP_AUTH_TOKEN }}
      # LDAP — the service container is reachable as hostname `ldap` on the job network
      LDAP_URI:      "ldap://ldap:389"
      LDAP_BASE_DN:  "dc=meli,dc=com"
      LDAP_BIND_DN:  "cn=admin,dc=meli,dc=com"
      LDAP_PASSWORD: "itachi"
      # OPSEC + timeouts
      PREFLIGHT_POLICY:     ${{ inputs.preflight_policy }}
      LLM_TIMEOUT_FLOOR:    "40"
      LLM_TIMEOUT_CEILING:  "240"
      # Iteration budget — blank string means "no cap" (agent uses HARD_CEILING)
      MUNIN_MAX_ITERATIONS: ${{ inputs.munin_max_iterations }}
      MUNIN_LOG_LEVEL:      "INFO"
      # Persistence knobs — auto-commit forged tools, open PR for soul edits.
      MUNIN_AUTO_COMMIT:  "1"
      MUNIN_AUTO_PR:      "1"
      MUNIN_GIT_USER:     "munin-bot"
      MUNIN_GIT_EMAIL:    "munin-bot@users.noreply.github.com"
      MUNIN_GIT_BRANCH:   "munin/session-${{ github.run_id }}"
      # Storage backend. Leave MUNIN_DB_URL empty to use local SQLite (default,
      # ephemeral across sessions unless persist_state=true rounds it via
      # artifact). Set it as a repo secret if you want to point at a Turso /
      # libsql cloud database for true persistent multi-session state.
      MUNIN_DB_URL:       ${{ secrets.MUNIN_DB_URL }}
      MUNIN_DB_AUTH_TOKEN: ${{ secrets.MUNIN_DB_AUTH_TOKEN }}
      # DEBIAN_FRONTEND avoids interactive prompts during apt-get inside Kali
      DEBIAN_FRONTEND: noninteractive

    steps:
      # fetch-depth: 0 = full history — needed so we can create branches and
      # push new commits (soul PRs, forged tool commits). token defaults to
      # the auto GITHUB_TOKEN with the permissions declared at the workflow
      # level above (contents: write, pull-requests: write).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Restore the most recent shared_state.sqlite from a previous run so
      # Munin's episodic/semantic memory and generated tool catalog survive
      # across sessions. This is the "poor man's Turso" — free-tier
      # persistence via GH artifacts. When MUNIN_DB_URL points at a real
      # libsql/Turso database, this step is a no-op (Turso already persists).
      - name: Restore Munin state from last session (artifact)
        if: ${{ inputs.persist_state && env.MUNIN_DB_URL == '' }}
        id: state_restore
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: live-session.yml
          workflow_conclusion: ""      # accept success or failure — we want the freshest state
          name: munin-state
          path: data/
          if_no_artifact_found: warn

      - name: Show restored state summary
        if: ${{ inputs.persist_state && env.MUNIN_DB_URL == '' }}
        run: |
          if [ -f data/shared_state.sqlite ]; then
              echo "✓ Restored data/shared_state.sqlite ($(du -h data/shared_state.sqlite | cut -f1))"
          else
              echo "· No previous state artifact — Munin starts fresh."
          fi

      - name: Install Munin runtime + offensive toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
              python3 python3-pip python3-venv python3-poetry \
              ca-certificates curl git pipx ldap-utils \
              build-essential libldap2-dev libsasl2-dev libssl-dev golang-go \
              nmap nuclei feroxbuster ffuf sqlmap hydra smbmap netexec \
              httpx-toolkit exploitdb eyewitness
          ln -s /usr/bin/httpx-toolkit /usr/local/bin/pd-httpx
          if command -v eyewitness >/dev/null 2>&1 && ! command -v EyeWitness >/dev/null 2>&1; then
              ln -s "$(command -v eyewitness)" /usr/local/bin/EyeWitness
          fi
          if ! command -v katana >/dev/null 2>&1; then
              GOBIN=/usr/local/bin go install github.com/projectdiscovery/katana/cmd/katana@latest
          fi
          if ! command -v poetry >/dev/null 2>&1; then
              pipx install poetry
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          poetry --version

      - name: Verify offensive toolchain is present
        run: |
          echo "── Required runner binaries ──"
          missing=0
          for bin in curl nmap nuclei feroxbuster ffuf sqlmap hydra smbmap netexec katana pd-httpx searchsploit EyeWitness; do
              if command -v "$bin" >/dev/null 2>&1; then
                  printf "  \033[32m✓\033[0m %-14s → %s\n" "$bin" "$(command -v "$bin")"
              else
                  printf "  \033[31m✗\033[0m %-14s (required)\n" "$bin"
                  missing=$((missing + 1))
              fi
          done
          if [ "$missing" -ne 0 ]; then
              echo "::error::${missing} required offensive binaries are missing"
              exit 1
          fi
          # Prime nuclei templates so the first tool call doesn't have to.
          nuclei -silent -ut 2>/dev/null || true

      - name: Install Munin
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Verify Turso online persistence
        if: ${{ env.MUNIN_DB_URL != '' }}
        run: poetry run python scripts/turso_smoke.py

      - name: Wait for mock LDAP
        run: |
          echo "Waiting for LDAP service container..."
          for i in $(seq 1 30); do
              if ldapsearch -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
                  -b "$LDAP_BASE_DN" "(objectClass=*)" dn 2>/dev/null | grep -q "result: 0"; then
                  echo "LDAP ready after ${i}s"
                  break
              fi
              sleep 1
          done

      - name: Seed mock LDAP data
        run: |
          ldapadd -H "$LDAP_URI" -x -D "$LDAP_BIND_DN" -w "$LDAP_PASSWORD" \
              -f scripts/ldap_mock.ldif 2>&1 | tail -20 || true

      - name: Start Munin MCP server
        run: |
          mkdir -p data soul
          MCP_HOST="127.0.0.1"
          if [ "${{ inputs.open_public_tunnel }}" = "true" ]; then
              MCP_HOST="0.0.0.0"
          fi
          nohup env PYTHONUNBUFFERED=1 RUNNER_TRACKING_ID="" poetry run munin mcp \
              --transport streamable-http --host "$MCP_HOST" --port 8890 \
              </dev/null > /tmp/munin.log 2>&1 &
          echo $! > /tmp/munin.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/munin.pid)" 2>/dev/null; then
              echo "::error::munin failed to start — dumping log"
              cat /tmp/munin.log
              exit 1
          fi

      - name: Verify Munin MCP is answering
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          url = 'http://localhost:8890/mcp'
          token = os.environ.get('MUNIN_MCP_AUTH_TOKEN', '')
          deadline = time.monotonic() + 90
          session_id = ''
          last_error = None
          while time.monotonic() < deadline:
              req_init = urllib.request.Request(
                  url,
                  data=json.dumps({
                      'jsonrpc': '2.0', 'id': 1, 'method': 'initialize',
                      'params': {
                          'protocolVersion': '2024-11-05',
                          'capabilities': {},
                          'clientInfo': {'name': 'ci-verifier', 'version': '1.0'},
                      },
                  }).encode(),
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json, text/event-stream',
                      'Authorization': f'Bearer {token}',
                  },
              )
              try:
                  with urllib.request.urlopen(req_init, timeout=15) as resp:
                      session_id = resp.headers.get('mcp-session-id', '')
                  if session_id:
                      break
                  last_error = RuntimeError('no mcp-session-id in initialize response')
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = exc
              time.sleep(2)
          if not session_id:
              print(f'::error::MCP not ready after 90s: {last_error}', file=sys.stderr)
              try:
                  print(open('/tmp/munin.log', encoding='utf-8', errors='replace').read(), file=sys.stderr)
              except OSError:
                  pass
              sys.exit(1)
          rpc_headers = {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json, text/event-stream',
                  'Authorization': f'Bearer {token}',
                  'mcp-session-id': session_id,
          }

          def rpc(request_id, method, params, timeout=30):
              request = urllib.request.Request(
                  url,
                  data=json.dumps({
                      'jsonrpc': '2.0',
                      'id': request_id,
                      'method': method,
                      'params': params,
                  }).encode(),
                  headers=rpc_headers,
              )
              with urllib.request.urlopen(request, timeout=timeout) as resp:
                  lines = resp.read().decode().splitlines()
              for line in lines:
                  if line.startswith('data: '):
                      return json.loads(line[6:])
              raise RuntimeError(f'no data line in {method} response')

          tool_message = rpc(2, 'tools/list', {})
          tools = tool_message.get('result', {}).get('tools', [])
          tool_names = {tool.get('name') for tool in tools}
          required_tools = {
              'nmap_scan', 'httpx_probe', 'nuclei_scan', 'feroxbuster_scan',
              'ffuf_scan', 'katana_crawl', 'hydra_attack', 'sqlmap_scan',
              'smbmap_scan', 'netexec_scan', 'munin_diagnostics',
          }
          missing_tools = sorted(required_tools - tool_names)
          if missing_tools:
              print(f'::error::missing MCP tools: {missing_tools}', file=sys.stderr)
              sys.exit(1)
          print(f'OK — {len(tools)} tools registered; offensive tool surface complete')

          nmap_message = rpc(
              3,
              'tools/call',
              {
                  'name': 'nmap_scan',
                  'arguments': {
                      'target': 'ldap',
                      'scan_type': '-sT',
                      'ports': '389',
                      'additional_args': '-Pn',
                      'mode': 'sync',
                      'timeout': 60,
                      'run_id': f'ci-nmap-{os.environ.get("GITHUB_RUN_ID", "manual")}',
                  },
              },
              timeout=90,
          )
          nmap_rendered = json.dumps(nmap_message, ensure_ascii=False)
          if (
              nmap_message.get('error')
              or nmap_message.get('result', {}).get('isError')
              or 'missing_dependency' in nmap_rendered
              or '389/tcp' not in nmap_rendered
          ):
              print(f'::error::nmap MCP smoke failed: {nmap_rendered}', file=sys.stderr)
              sys.exit(1)
          print('OK — nmap_scan executed through MCP against the authorized LDAP service')
          PY

      - name: Open public tunnel
        if: ${{ inputs.open_public_tunnel }}
        run: bash scripts/open_tunnel.sh 8890

      - name: Print connection info
        if: ${{ inputs.open_public_tunnel }}
        run: |
          URL="${MUNIN_PUBLIC_URL:-http://localhost:8890}"
          echo "URL: ${URL}"
          echo "Token: configured as repository secret (not printed)"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Munin — live session

          | | |
          |---|---|
          | **URL** | \`${URL}\` |
          | **Authentication** | Bearer token from the \`MUNIN_MCP_AUTH_TOKEN\` repository secret |
          | **Duration** | ${{ inputs.duration_minutes }} min |
          | **Preflight** | \`${{ inputs.preflight_policy }}\` |
          | **Max iterations** | \`${MUNIN_MAX_ITERATIONS:-unbounded}\` |
          | **Runner** | \`kalilinux/kali-rolling\` (offensive toolchain installed and verified) |

          Quick test:
          \`\`\`bash
          curl -X POST ${URL}/mcp/ \\
              -H "Authorization: Bearer <MUNIN_MCP_AUTH_TOKEN>" \\
              -H "Content-Type: application/json" \\
              -d '{"jsonrpc":"2.0","id":"1","method":"tools/list","params":{}}'
          \`\`\`
          SUMMARY

      - name: Keep session alive
        # Self-cap at 55 min for safety
        run: |
          MINS=${{ inputs.duration_minutes }}
          if [ "$MINS" -gt 55 ]; then MINS=55; fi
          sleep $((MINS * 60))

      - name: Munin server logs (tail)
        if: always()
        run: |
          echo "── /tmp/munin.log (tail 100) ──"
          tail -100 /tmp/munin.log 2>/dev/null || echo "(no log)"
          echo "── /tmp/tunnel.log ──"
          cat /tmp/tunnel.log 2>/dev/null || echo "(no tunnel log)"

      # Gracefully stop MCP so SQLite flushes WAL and pending git-persist
      # commits ship. If the process is stuck we SIGKILL after 15s.
      - name: Stop Munin cleanly
        if: always()
        run: |
          PID=$(cat /tmp/munin.pid 2>/dev/null || echo "")
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID"
              for i in $(seq 1 15); do
                  kill -0 "$PID" 2>/dev/null || break
                  sleep 1
              done
              kill -KILL "$PID" 2>/dev/null || true
          fi

      # Force one last git push in case the in-process git_persist worker had
      # anything queued. Defensive — the worker already runs before SIGTERM,
      # but a partial batch could still be sitting for a couple seconds.
      - name: Final git push (forged artifacts)
        if: always() && env.MUNIN_AUTO_COMMIT == '1'
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain)" ]; then
              git config user.name  "${MUNIN_GIT_USER}"
              git config user.email "${MUNIN_GIT_EMAIL}"
              git add munin/generated/ soul/ data/soul_pending/ 2>/dev/null || true
              if ! git diff --staged --quiet; then
                  git commit -m "[munin][session-end] flush pending forge artifacts (${GITHUB_RUN_ID})" || true
                  git checkout -B "${MUNIN_GIT_BRANCH}" 2>/dev/null || true
                  git push -u origin "${MUNIN_GIT_BRANCH}" || echo "final push failed (non-fatal)"
              fi
          fi

      # Persist SQLite state so the NEXT session resumes where this one left
      # off. Only fires when persist_state=true AND we're on file SQLite
      # (Turso already persists remotely, so this becomes a no-op).
      - name: Upload Munin state (soul + memory + forge registry)
        if: always() && inputs.persist_state && env.MUNIN_DB_URL == ''
        uses: actions/upload-artifact@v4
        with:
          name: munin-state
          path: |
            data/shared_state.sqlite
            data/shared_state.sqlite-wal
            data/shared_state.sqlite-shm
            data/soul_pending/
            data/wake_artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload full logs as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: munin-session-${{ github.run_id }}
          path: |
            /tmp/munin.log
            /tmp/tunnel.log
            data/events.jsonl
          retention-days: 7
